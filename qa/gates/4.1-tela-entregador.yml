schema: 1
story: '4.1'
story_title: 'Tela do Entregador (Joao) — Interface EXTREMAMENTE Simples'
gate: CONCERNS
status_reason: >
  Implementacao solida com boa arquitetura de segurança (dupla proteção auth + RLS).
  O issue HIGH de subscription sem filtro foi corrigido via refactoring durante o review.
  Permanecem issues MEDIUM: two-step update sem transação (risco de inconsistência de estado),
  multiplas queries de role por request no middleware, e cobertura de testes limitada a utils.
reviewer: 'Aria (System Architect)'
updated: '2026-06-11T12:00:00Z'

top_issues:
  - id: I01
    severity: medium
    category: reliability
    description: >
      markDelivered executa dois UPDATEs sequenciais sem transação (delivery_items → orders).
      Se o segundo UPDATE falhar, o estado fica inconsistente: delivery_item marcado como entregue
      mas order ainda com status anterior.
    recommendation: >
      Criar uma Supabase database function (RPC) que execute os dois UPDATEs atomicamente,
      ou usar a Supabase transactions API quando disponível.
    file: 'apps/web/src/hooks/use-driver-deliveries.ts'
    suggested_owner: dev

  - id: I02
    severity: medium
    category: performance
    description: >
      proxy.ts executa até 3 queries separadas para buscar profile.role por request HTTP,
      uma para cada bloco condicional (login redirect, root redirect, /driver guard, driver-guard).
      Requests que caem em multiplos blocos fazem multiplas round-trips ao banco.
    recommendation: >
      Buscar role uma única vez por request, armazenar em variável local, reutilizar nos blocos subsequentes.
    file: 'apps/web/src/proxy.ts'
    suggested_owner: dev

  - id: I03
    severity: medium
    category: tests
    description: >
      Cobertura de testes limitada a utility functions puras (delivery.ts).
      Nenhum teste para componentes React, hook useDriverDeliveries, fluxo de redirect bidirecional,
      ou integração da subscription realtime.
    recommendation: >
      Adicionar testes de componente para DeliveryCard e DeliveryConfirmSheet com Vitest/Testing Library
      na próxima sprint. Documentar como tech debt.
    file: 'packages/shared/src/utils/__tests__/delivery.test.ts'
    suggested_owner: dev

  - id: I04
    severity: medium
    category: reliability
    description: >
      'today' calculado uma vez no mount do hook como new Date().toISOString().split('T')[0].
      Se o app permanecer aberto após meia-noite, a lista não atualizará para o novo dia
      até o próximo refresh manual ou remount do componente.
    recommendation: >
      Edge case raro para este contexto de uso. Documentar como known limitation.
      Solução futura: adicionar um useEffect que detecta mudança de dia e refaz o fetch.
    file: 'apps/web/src/hooks/use-driver-deliveries.ts'
    suggested_owner: dev

  - id: I05
    severity: low
    category: maintainability
    description: >
      driverOnlyPaths em proxy.ts é uma cópia parcial de PROTECTED_PATHS.
      Nova rota adicionada a PROTECTED_PATHS pode não ser adicionada a driverOnlyPaths,
      quebrando silenciosamente a proteção bidirecional.
    recommendation: >
      Derivar driverOnlyPaths de PROTECTED_PATHS via filter/exclusão ao invés de lista hardcoded.
    file: 'apps/web/src/proxy.ts'
    suggested_owner: dev

waiver:
  active: false

