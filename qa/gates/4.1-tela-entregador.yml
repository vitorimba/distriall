nfr_validation:
  security:
    status: CONCERNS
    notes: >
      Dupla proteção (proxy.ts server + layout.tsx client) implementada corretamente.
      RLS habilitado e bem configurado em deliveries e delivery_items.
      Sem dados financeiros expostos na UI nem na query.
      Issue corrigido: subscription delivery_items agora filtrada por delivery_id do entregador
      (refactoring aplicado durante este review).
      Remaining concern: orders table RLS deve garantir que entregadores não leiam
      campos financeiros (subtotal, total, profit) diretamente — não verificado nesta story.
  performance:
    status: CONCERNS
    notes: >
      Índices adequados na migration (4 índices em deliveries, 4 em delivery_items).
      Múltiplas queries de role por request HTTP no middleware — I02.
      Query com !inner joins é eficiente mas depende de índices em tabelas relacionadas.
  reliability:
    status: CONCERNS
    notes: >
      Two-step update sem transação — I01. Cleanup de subscription no unmount implementado.
      today sem reatividade após meia-noite — I04 (edge case aceitável).
  maintainability:
    status: PASS
    notes: >
      Código limpo, responsabilidades bem separadas. Nomenclatura descritiva em pt-BR.
      Componentes focados e testáveis. Após refactoring: subscription movida para hook,
      page.tsx simplificada — melhora coesão.

