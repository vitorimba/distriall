<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; }
  #root { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: start; }
  .caption {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); font-family: var(--font-mono); margin-bottom: 8px;
  }
  .cell { min-width: 0; }
  .spark-row { display: flex; align-items: center; gap: 12px; }
  .spark-row .num { font-size: 15px; font-weight: 700; }
  .spark-row small { font-size: 11px; color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { LineChart, BarChart, DonutChart, HBarList, Sparkline } = window.DistriAllDesignSystem_b6afd7;
const fmtBRL = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

const SEMANA = [
  { label: 'Seg', value: 3200 }, { label: 'Ter', value: 4100 }, { label: 'Qua', value: 3650 },
  { label: 'Qui', value: 5200 }, { label: 'Sex', value: 6840 }, { label: 'Sáb', value: 4480 }, { label: 'Dom', value: 1050 },
];
const PAGAMENTOS = [
  { label: 'Pix', value: 42 }, { label: 'Dinheiro', value: 23 }, { label: 'Boleto', value: 18 },
  { label: 'Vale', value: 10 }, { label: 'Cartão', value: 7 },
];
const TOP = [
  { label: 'Cerveja pilsen (fd 12)', value: 6204 }, { label: 'Água mineral (cx 12)', value: 4944 },
  { label: 'Refrigerante cola 2L', value: 2304 }, { label: 'Suco de uva 1,5L', value: 1352 },
];

function Demo() {
  return (
    <React.Fragment>
      <div className="cell">
        <div className="caption">LineChart · evolução de faturamento (hover nos pontos)</div>
        <LineChart data={SEMANA} height={120} formatValue={fmtBRL} />
      </div>
      <div className="cell">
        <div className="caption">DonutChart · formas de pagamento (hover na legenda)</div>
        <DonutChart data={PAGAMENTOS} size={110} centerValue="312" centerLabel="pedidos" />
      </div>
      <div className="cell">
        <div className="caption">BarChart · pedidos por dia (showValues)</div>
        <BarChart data={SEMANA.map(d => ({ ...d, value: Math.round(d.value / 90) }))} height={110} showValues />
      </div>
      <div className="cell">
        <div className="caption">HBarList · top produtos</div>
        <HBarList data={TOP} formatValue={fmtBRL} />
        <div className="caption" style={{ marginTop: 14 }}>Sparkline · em StatCards</div>
        <div className="spark-row">
          <div>
            <span className="num">R$ 28.520</span>
            <small>faturamento</small>
          </div>
          <Sparkline values={[3200, 4100, 3650, 5200, 6840, 4480]} width={90} height={28} />
          <Sparkline values={[980, 870, 920, 760, 690, 720]} width={90} height={28} color="var(--danger)" />
        </div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
