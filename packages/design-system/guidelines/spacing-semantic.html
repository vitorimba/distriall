<!-- @dsCard group="Espaçamento" viewport="700x230" name="Espaçamento semântico" subtitle="Tokens por uso: page-pad, section-gap, card-pad, stack-gap, inline-gap" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 14px; }
  .page { background: var(--surface-page); border: 1px dashed var(--border-strong); border-radius: 10px; padding: 24px; position: relative; }
  .cardx { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px; }
  .cardx + .cardx { margin-top: 16px; }
  .linha { height: 8px; border-radius: 4px; background: var(--surface-inset); }
  .linha + .linha { margin-top: 12px; }
  .linha--titulo { width: 38%; background: var(--border-strong); }
  .tag {
    position: absolute; font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
    color: var(--accent-fg); background: var(--accent-soft); border: 1px solid var(--accent-soft-border);
    padding: 1px 6px; border-radius: 999px; white-space: nowrap;
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 10.5px; color: var(--text-secondary); }
  .legend code { font-family: var(--font-mono); color: var(--accent-fg); font-size: 10px; }
</style>
</head>
<body>
  <div class="page">
    <span class="tag" style="top: 4px; left: 4px;">--page-pad 24</span>
    <div class="cardx" style="position: relative;">
      <span class="tag" style="top: 3px; right: 6px;">--card-pad 20</span>
      <div class="linha linha--titulo"></div>
      <div class="linha" style="position: relative;">
        <span class="tag" style="top: -8px; left: 42%;">--stack-gap 12</span>
      </div>
      <div class="linha"></div>
    </div>
    <div class="cardx" style="position: relative; padding: 12px 20px;">
      <span class="tag" style="top: -11px; left: 42%;">--section-gap 16</span>
      <div class="linha" style="margin: 0; width: 55%;"></div>
    </div>
  </div>
  <div class="legend">
    <span><code>--page-pad</code> conteúdo desktop · 16 no mobile</span>
    <span><code>--inline-gap 8</code> botões/chips lado a lado</span>
    <span><code>--field-gap 6</code> label → input</span>
  </div>
</body>
</html>
