const { Skeleton, EmptyState, Alert, Button, Toast, Icon } = window.DistriAllDesignSystem_b6afd7;

function Demo() {
  return (
    <React.Fragment>
      <div className="cellx">
        <div className="capx">loading <i>skeleton espelha o layout — nunca spinner de página</i></div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
