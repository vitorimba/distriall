<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .swatch { height: 64px; border-radius: 8px; border: 1px solid var(--border-subtle); position: relative; }
  .strip b { display: block; text-align: center; font-size: 9.5px; font-weight: 600; color: var(--text-muted); margin-top: 5px; font-family: var(--font-mono); }
  .roles { display: flex; gap: 16px; margin-top: 10px; font-size: 11px; color: var(--text-secondary); flex-wrap: wrap; }
  .roles span b { color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
  <div class="strip">
    <div><div class="swatch" style="background: var(--gray-950);"></div><b>950</b></div>
    <div><div class="swatch" style="background: var(--gray-900);"></div><b>900</b></div>
    <div><div class="swatch" style="background: var(--gray-850);"></div><b>850</b></div>
    <div><div class="swatch" style="background: var(--gray-800);"></div><b>800</b></div>
    <div><div class="swatch" style="background: var(--gray-700);"></div><b>700</b></div>
    <div><div class="swatch" style="background: var(--gray-600);"></div><b>600</b></div>
    <div><div class="swatch" style="background: var(--gray-500);"></div><b>500</b></div>
    <div><div class="swatch" style="background: var(--gray-400);"></div><b>400</b></div>
    <div><div class="swatch" style="background: var(--gray-300);"></div><b>300</b></div>
    <div><div class="swatch" style="background: var(--gray-200);"></div><b>200</b></div>
    <div><div class="swatch" style="background: var(--gray-100);"></div><b>100</b></div>
    <div><div class="swatch" style="background: var(--white);"></div><b>wht</b></div>
  </div>
  <div class="roles">
    <span><b>950</b> página</span>
    <span><b>900</b> card</span>
    <span><b>850</b> elevado</span>
    <span><b>800</b> controle</span>
    <span><b>700</b> borda forte</span>
    <span><b>300</b> texto 2º</span>
  </div>
</body>
</html>
