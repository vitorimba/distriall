<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; }
  .strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .swatch { height: 84px; border-radius: var(--radius-md); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .swatch b { font-size: 12px; font-weight: 600; }
  .swatch span { font-size: 10.5px; opacity: 0.75; font-family: var(--font-mono); }
  .dk { color: #1a1208; }
  .lt { color: #fff; }
  .main { outline: 2px solid var(--orange-400); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="strip">
    <div class="swatch dk" style="background: var(--orange-200);"><b>200</b><span>#FED7AA</span></div>
    <div class="swatch dk" style="background: var(--orange-300);"><b>300</b><span>#FDBA74</span></div>
    <div class="swatch dk" style="background: var(--orange-400);"><b>400</b><span>#FB923C</span></div>
    <div class="swatch lt main" style="background: var(--orange-500);"><b>500 · accent</b><span>#F97A1E</span></div>
    <div class="swatch lt" style="background: var(--orange-600);"><b>600 · press</b><span>#E2640D</span></div>
    <div class="swatch lt" style="background: var(--orange-700);"><b>700</b><span>#C2530B</span></div>
  </div>
</body>
</html>
