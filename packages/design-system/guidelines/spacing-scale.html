<!-- @dsCard group="Espaçamento" viewport="700x150" name="Escala de espaçamento" subtitle="Base 4px — gaps de card 16-20, seções 24-32" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px; display: flex; align-items: flex-end; gap: 18px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { width: 26px; background: var(--accent-soft); border: 1px solid var(--accent-soft-border); border-radius: 4px; }
  .step b { font-size: 10.5px; color: var(--text-secondary); font-family: var(--font-mono); font-weight: 500; }
</style>
</head>
<body>
  <div class="step"><div class="bar" style="height: 4px;"></div><b>1·4</b></div>
  <div class="step"><div class="bar" style="height: 8px;"></div><b>2·8</b></div>
  <div class="step"><div class="bar" style="height: 12px;"></div><b>3·12</b></div>
  <div class="step"><div class="bar" style="height: 16px;"></div><b>4·16</b></div>
  <div class="step"><div class="bar" style="height: 20px;"></div><b>5·20</b></div>
  <div class="step"><div class="bar" style="height: 24px;"></div><b>6·24</b></div>
  <div class="step"><div class="bar" style="height: 32px;"></div><b>8·32</b></div>
  <div class="step"><div class="bar" style="height: 40px;"></div><b>10·40</b></div>
  <div class="step"><div class="bar" style="height: 48px;"></div><b>12·48</b></div>
</body>
</html>
