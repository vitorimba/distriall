<!-- @dsCard group="Cores" viewport="700x240" name="Pares dark × light" subtitle="Mesmo token, dois valores — o nome nunca muda entre temas" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 0; display: grid; grid-template-columns: 1fr 1fr; min-height: 220px; }
  .half { padding: 14px 16px; }
  .half[data-theme="light"] { background: var(--surface-page); }
  .half h5 { margin: 0 0 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-family: var(--font-mono); }
  .tok { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
  .dot { width: 16px; height: 16px; border-radius: 5px; border: 1px solid var(--border-strong); flex: none; }
  .chip { padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-fg); font-weight: 600; font-size: 10.5px; }
</style>
</head>
<body>
  <div class="half" style="background: var(--surface-page);">
    <h5>dark (padrão)</h5>
    <div class="tok"><span class="dot" style="background: var(--surface-page);"></span>--surface-page</div>
    <div class="tok"><span class="dot" style="background: var(--surface-card);"></span>--surface-card</div>
    <div class="tok"><span class="dot" style="background: var(--surface-inset);"></span>--surface-inset</div>
    <div class="tok"><span class="dot" style="background: var(--accent);"></span>--accent <span class="chip">orange-500</span></div>
    <div class="tok"><span class="dot" style="background: var(--text-primary);"></span>--text-primary</div>
    <div class="tok"><span class="dot" style="background: var(--border-subtle);"></span>--border-subtle</div>
  </div>
  <div class="half" data-theme="light">
    <h5>light (data-theme="light")</h5>
    <div class="tok"><span class="dot" style="background: var(--surface-page);"></span>--surface-page</div>
    <div class="tok"><span class="dot" style="background: var(--surface-card);"></span>--surface-card</div>
    <div class="tok"><span class="dot" style="background: var(--surface-inset);"></span>--surface-inset</div>
    <div class="tok"><span class="dot" style="background: var(--accent);"></span>--accent <span class="chip">orange-600</span></div>
    <div class="tok"><span class="dot" style="background: var(--text-primary);"></span>--text-primary</div>
    <div class="tok"><span class="dot" style="background: var(--border-subtle);"></span>--border-subtle</div>
  </div>
</body>
</html>
