<!-- @template name="Login" description="Tela de login DistriAll: card central, logo, erro inline" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DistriAll — login</title>
<!-- template: login DistriAll -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>
</head>
<body>
<div id="root"></div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  let tries = 0;
  (function boot() {
    const DS = window.DistriAllDesignSystem_b6afd7;
    if (!DS) {
      if (++tries > 100) { console.error('DS bundle não carregou'); return; }
      setTimeout(boot, 50);
      return;
    }
    const code = document.getElementById('app-src').textContent;
    const compiled = Babel.transform(code, { presets: ['react'] }).code;
    new Function('React', 'ReactDOM', 'DS', compiled)(React, ReactDOM, DS);
  })();
});
</script>
<script id="app-src" type="text/plain">
const { LoginScreen } = DS;

/* ajuste o caminho do logo junto com a linha base do ds-base.js */
const LOGO = '../../assets/distriall-logo-on-dark.png';

function App() {
  return <LoginScreen logoSrc={LOGO} onLogin={() => {}} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
