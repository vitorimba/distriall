# ============================================================================
# MERCADO LIVRE
# ============================================================================
mercado_livre:
  status: "ATIVO"
  ultima_mudanca: "2026-03-02"
  fonte: "https://www.mercadolivre.com.br/ajuda/quanto-custa-vender-um-produto_1338"

  comissao:
    modelo: "percentual_por_categoria_e_tipo_anuncio"
    tipos_anuncio:
      gratis:
        comissao: "0%"
        exposicao: "baixa"
        parcelamento: "não"
        limite: "sim (quantidade limitada)"
      classico:
        comissao_range: "11% a 14%"
        exposicao: "média"
        parcelamento: "até 6x (vendedor absorve)"
      premium:
        comissao_range: "16% a 19%"
        exposicao: "máxima"
        parcelamento: "até 12x (vendedor absorve)"

    por_categoria_classico:
      celulares_smartphones: "13%"
      eletronicos: "13%"
      informatica: "12%"
      eletrodomesticos: "11%"
      moda_vestuario: "14%"
      beleza_cuidado_pessoal: "14%"
      casa_decoracao: "13%"
      brinquedos: "14%"
      automotivo: "12%"
      esporte_fitness: "13%"

    por_categoria_premium:
      celulares_smartphones: "18%"
      eletronicos: "17%"
      informatica: "16%"
      eletrodomesticos: "16%"
      moda_vestuario: "19%"
      beleza_cuidado_pessoal: "19%"
      casa_decoracao: "17%"
      brinquedos: "18%"
      automotivo: "16%"
      esporte_fitness: "17%"

  taxa_fixa:
    modelo: "custo_operacional_variavel"
    vigencia: "a partir de 2026-03-02"
    regra_anterior: "R$ 6,00 fixo para produtos < R$ 79"
    regra_atual: >
      Custo operacional variável baseado em peso, dimensões da
      embalagem e cubagem logística. Aplica-se a produtos < R$ 79.
      Produtos >= R$ 79: sem custo fixo adicional.
    nota: "Valor exato calculado no Seller Center por SKU"

  frete:
    mercado_envios_full:
      tipo: "fulfillment"
      custo: "variável por peso/dimensão"
      beneficio: "selo Full, frete mais rápido"
    frete_gratis:
      threshold: "R$ 79"
      regra: "ML subsidia parte do frete para sellers com boa reputação"
      custo_seller: "parcial (varia por reputação e distância)"

  ads:
    product_ads:
      modelo: "CPC"
      cpc_minimo: "~R$ 0,30"
    recomendacao_investimento: "5% a 15% do faturamento"

  mensalidade: "não"
  ciclo_pagamento: "D+14 padrão, antecipação disponível"

  programas_especiais:
    mercadolider:
      tipo: "reputação por volume"
      beneficios: "mais exposição, subsídios de frete, badge"
    mercado_envios_full:
      tipo: "fulfillment"
      beneficios: "entrega rápida, badge Full, maior conversão"

# ============================================================================
# SHOPEE
# ============================================================================
shopee:
  status: "ATIVO"
  ultima_mudanca: "2026-03-01"
  fonte: "https://seller.shopee.com.br/edu/article/26839/Comissao-para-vendedores-CNPJ-e-CPF-em-2026"

  comissao:
    modelo: "faixas_escalonadas_por_valor"
    vigencia: "a partir de 2026-03-01"

    mudancas_marco_2026:
      - "Cap de R$105 REMOVIDO"
      - "Distinção CPF/CNPJ ELIMINADA (mesma tabela)"
      - "Frete grátis OBRIGATÓRIO para todos os sellers"
      - "Toggle de frete grátis eliminado"

    faixas:
      - faixa: "< R$ 8,00"
        comissao: "50% do valor do produto"
        taxa_fixa: "R$ 0"
        custo_total_exemplo: "Produto R$7 → taxa R$3,50"

      - faixa: "R$ 8,00 a R$ 79,99"
        comissao: "20%"
        taxa_fixa: "R$ 4,00"
        custo_total_exemplo: "Produto R$50 → R$10 + R$4 = R$14 (28%)"

      - faixa: "R$ 80,00 a R$ 99,99"
        comissao: "14%"
        taxa_fixa: "R$ 16,00"
        custo_total_exemplo: "Produto R$90 → R$12,60 + R$16 = R$28,60 (31,8%)"

      - faixa: "R$ 100,00 a R$ 199,99"
        comissao: "14%"
        taxa_fixa: "R$ 20,00"
        custo_total_exemplo: "Produto R$150 → R$21 + R$20 = R$41 (27,3%)"

      - faixa: "R$ 200,00+"
        comissao: "14%"
        taxa_fixa: "R$ 26,00"
        custo_total_exemplo: "Produto R$300 → R$42 + R$26 = R$68 (22,7%)"

    nota: "Sem cap — produtos caros pagam 14% integral sem limite"

  taxa_fixa:
    modelo: "embutida_nas_faixas"
    jan_fev_2026: "R$ 7,00 por item (antes R$ 5,00)"
    marco_2026: "Substituída por faixas escalonadas (R$ 0 a R$ 26)"

  frete:
    programa_frete_gratis:
      status: "OBRIGATÓRIO desde março/2026"
      custo_seller: "incluído nas faixas"
      regra_anterior: "~6% do valor, toggle opcional"
    shopee_envios:
      parceiros: ["Correios", "Jadlog", "Total Express"]

  ads:
    shopee_ads:
      modelo: "CPC"
      cpc_minimo: "~R$ 0,05"
      tipos: ["Discovery (busca)", "Boost (impulsionamento)"]
    recomendacao: "5% a 15% do faturamento"

  mensalidade: "não"
  ciclo_pagamento: "após confirmação de entrega"

  novos_vendedores:
    beneficio: "comissão reduzida nos primeiros meses"
    condicao: "cumprimento de métricas de performance"

