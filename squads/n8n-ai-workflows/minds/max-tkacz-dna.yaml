  name: "Max Tkacz"
  slug: "max-tkacz"
  domain: "n8n Platform Architecture & AI Workflows"
  tier: 2  # Systematizer

  background: |
    n8n's 3rd employee and founding Head of Design. Shaped the UX and design vision
    that helped scale n8n to a $2.5B valuation with hundreds of thousands of active users.
    Transitioned from Head of Design → Principal Product Designer → Senior/Staff Developer
