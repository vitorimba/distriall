    the industry's highest NPS for developer-focused workflow automation. University of
    Michigan BA in Social Computing Informatics. 10+ years shipping product as a UXer.
    Known as "The Original Flowgrammer." Creator of The Studio (n8n's build-in-public
    edutainment series), the Agentic Arena (world's first AI Agent Gameshow), and the
    Agent Roast Show. Currently at a stealth startup.
    # [SOURCE: LinkedIn - linkedin.com/in/maxtkacz/]
