workflow:
  id: "FC-WF-004"
  name: "Coach Onboarding"
  version: "1.0.0"
  squad: "fitcoach"
  type: "coach-lifecycle"
  pattern_prefix: "FC"
  updated_at: "2026-03-11"
  description: >-
    Onboarding completo de um novo coach/personal trainer na plataforma FitCoach.
    Transforma um negocio de coaching presencial/improvisado em uma operacao
    digital estruturada com automacoes, gamificacao, e-commerce e conteudo.
    Baseado nos frameworks de Alex Hormozi ($100M Offers), Chris Cooper
    (Two-Brain Business), Nir Eyal (Hooked) e Yu-kai Chou (Octalysis).
  trigger: "Coach assinou contrato com a plataforma FitCoach e completou formulario de pre-cadastro"

  metadata:
    elicit: true
    confirmation_required: true
    estimated_duration: "2-4 semanas (14-28 dias)"
    total_phases: 8
    tasks_involved: 14
    recurring_phases: [8]
    target_persona: "Personal trainer / coach fitness"
    example_coach: "Carlos Salvador Jr"

  entry_conditions:
    - "Coach assinou contrato com a plataforma FitCoach"
    - "Coach possui pelo menos 5 alunos ativos"
    - "Coach tem presenca digital minima (Instagram ativo)"
    - "Coach completou formulario de pre-cadastro"
    - "Reuniao kick-off agendada com fitcoach-chief"

  exit_conditions:
    - "Coach completou 8 fases com aprovacao em todos os checkpoints"
    - "Pelo menos 80% dos alunos migrados para a plataforma"
    - "Primeiras automacoes ativas e funcionando"
    - "E-commerce configurado e primeiro produto listado"
    - "Report de resultados vs baseline entregue"

  agents_involved:
    - agent: "fitcoach-chief"
      role: "Orquestrador principal e configuracao da plataforma"
    - agent: "business-diagnostician"
      role: "Diagnostico de negocio e analise de gaps"
    - agent: "gym-scaler"
      role: "Design de ofertas com Value Equation (Hormozi)"
    - agent: "gym-operator"
      role: "Operacoes e SOPs do negocio"
    - agent: "automation-engineer"
      role: "WhatsApp, email e automacoes"
    - agent: "gamification-designer"
      role: "Sistema de pontos, niveis e desafios"
    - agent: "ecommerce-manager"
      role: "Loja, produtos e pagamentos"
    - agent: "content-repurposer"
      role: "Reaproveitamento de conteudo existente"
    - agent: "retention-engineer"
      role: "Hook Model e estrategias de retencao"

  estimated_effort:
    fitcoach_chief: "Presente em todas as fases (orquestrador)"
    business_diagnostician: "~40h (Phase 1)"
    gym_scaler: "~24h (Phase 2)"
    automation_engineer: "~32h (Phases 3, 5)"
    gamification_designer: "~20h (Phase 6)"
    retention_engineer: "~16h (Phase 6)"
    ecommerce_manager: "~24h (Phase 7)"
    gym_operator: "~20h (Phase 8)"
    content_repurposer: "~12h (Phases 2, 8)"
    total: "~188h distributed among agents"

  phases:
    # =====================================================
    # PHASE 1: Business Assessment (Dias 1-2)
    # =====================================================
    - id: "phase-1"
      name: "Business Assessment"
      agent: "business-diagnostician"
      checkpoint_id: "FC-CP-ONBOARD-001"
      duration: "2 dias (1 dia coleta + 1 dia analise)"
      timeline: "Dias 1-2"
      task: "business-diagnostic.md"
      objectives:
        - "Entender o modelo de negocio atual em todas as dimensoes"
        - "Mapear a base de alunos existente com dados quantitativos e qualitativos"
        - "Identificar os gaps operacionais criticos"
        - "Definir metas de crescimento realistas e mensuraveis (SMART)"
        - "Estabelecer o baseline financeiro para calculo de ROI"
      inputs:
        - name: "Nome completo do coach"
          type: "text"
          required: true
          source: "Formulario pre-cadastro"
        - name: "Nome da marca/empresa"
          type: "text"
          required: true
          source: "Formulario pre-cadastro"
        - name: "Instagram e outras redes"
          type: "urls"
          required: true
          source: "Formulario pre-cadastro"
        - name: "Numero de alunos ativos"
          type: "number"
          required: true
          source: "Coach informa"
        - name: "Lista de alunos (nome + contato + valor)"
          type: "spreadsheet"
          required: true
          source: "Coach exporta"
        - name: "MRR atual"
          type: "currency"
          required: true
          source: "Coach informa"
        - name: "Horas trabalhadas por semana"
          type: "number"
          required: true
          source: "Coach estima"
        - name: "Ferramentas em uso"
          type: "list"
          required: true
          source: "Coach lista"
        - name: "Objetivo de crescimento"
          type: "text"
          required: true
          source: "Reuniao kick-off"
        - name: "Historico de churn"
          type: "percentage"
          required: false
          source: "Coach informa"
      steps:
        - id: "1.1"
          name: "Reuniao de Kick-Off"
          duration: "90 minutos"
          executors: ["fitcoach-chief", "business-diagnostician"]
          agenda:
            - "Apresentacao da plataforma e do processo de onboarding (15 min)"
            - "Historia do coach: como chegou ate aqui, por que quer escalar (20 min)"
            - "Walkthrough do negocio atual: o que oferece, para quem, como (30 min)"
            - "Dores e frustracoes: o que mais consome tempo e energia (15 min)"
            - "Visao de futuro: onde quer estar em 6 meses, 1 ano, 3 anos (10 min)"
        - id: "1.2"
          name: "Inventario de Receitas"
          description: >-
            Mapear todas as fontes de receita: mensalidades presenciais, online,
            programas com prazo, assessoria nutricional, venda de suplementos,
            conteudo (cursos, e-books, mentorias), eventos.
            Calcular: ticket medio, LTV atual, MRR.
        - id: "1.3"
          name: "Mapeamento da Base de Alunos"
          description: >-
            Para cada aluno: nome, contato, objetivo, tempo de relacionamento,
            valor pago, frequencia de treino, canal preferido, NPS informal,
            historico de pagamento. Calcular Pareto (20% que geram 80% receita).
        - id: "1.4"
          name: "Auditoria de Ferramentas Atuais"
          description: >-
            Inventariar todas as ferramentas: para que usa, frequencia, custo/mes,
            substituivel pela plataforma? Identificar quais substituir, integrar ou manter.
        - id: "1.5"
          name: "Identificacao das TOP 3 Dores Operacionais"
          description: >-
            Para cada dor: descricao detalhada, tempo gasto/semana, impacto financeiro,
            solucao atual (se houver), como a plataforma resolve.
        - id: "1.6"
          name: "Analise de Capacidade"
          description: >-
            Calcular: capacidade atual vs desejada, gargalo principal,
            distribuicao do tempo de trabalho por atividade.
            Ferramenta: Time Audit de 1 semana.
        - id: "1.7"
          name: "Definicao de Metas SMART"
          description: >-
            Definir metas em 6 dimensoes (numero de alunos, MRR, horas/semana,
            NPS, churn rate, ticket medio) para 30 dias, 90 dias e 1 ano.
        - id: "1.8"
          name: "Verificacao de Pre-Requisitos Tecnicos"
          checklist:
            - "Smartphone com WhatsApp Business"
            - "E-mail profissional"
            - "Acesso a internet estavel"
            - "Conta bancaria PJ ou CPF para recebimentos"
            - "CNPJ ativo (se aplicavel)"
            - "Dispositivo para gravacao de videos"
      outputs:
        - name: "business-diagnostic-report.md"
          format: "Markdown"
          owner: "business-diagnostician"
        - name: "current-state-analysis.md"
          format: "Markdown"
          owner: "business-diagnostician"
        - name: "growth-roadmap-draft.md"
          format: "Markdown"
          owner: "fitcoach-chief"
        - name: "client-database-raw.csv"
          format: "CSV"
          owner: "business-diagnostician"
        - name: "operational-pain-map.md"
          format: "Markdown"
          owner: "business-diagnostician"
        - name: "smart-goals.md"
          format: "Markdown"
          owner: "fitcoach-chief"
      checkpoint:
        id: "FC-CP-ONBOARD-001"
        name: "Assessment Complete Gate"
        type: "blocking"
        approvers: ["fitcoach-chief", "business-diagnostician"]
        decision: "GO | NO-GO | CONDITIONAL GO"
        criteria:
          - "Diagnostico completo preenchido com todos os campos"
          - "Dores operacionais documentadas e quantificadas (pelo menos 3)"
          - "Metas SMART definidas e aprovadas pelo coach"
          - "Lista de alunos recebida e estruturada"
          - "Baseline financeiro calculado (MRR, ticket medio, LTV)"
          - "Capacidade atual vs desejada documentada"
          - "Pre-requisitos tecnicos verificados"
          - "Coach assinou termo de comprometimento com o processo"
          - "Roadmap de crescimento aprovado pelo coach"
          - "Nenhuma Veto Condition ativa"
        veto_conditions:
          - id: "VETO-001"
            name: "Base minima de alunos"
            condition: "Coach possui menos de 5 alunos ativos"
            action: "Apresentar versao simplificada (Tier Starter), agendar revisao em 60 dias"
          - id: "VETO-002"
            name: "Presenca digital minima"
            condition: "Instagram com menos de 100 seguidores E nenhuma outra presenca digital"
            action: "Incluir Fase 0 de Branding Digital (duracao adicional: 1 semana)"
          - id: "VETO-003"
            name: "Comprometimento do coach"
            condition: "Coach nao completou Time Audit nem forneceu lista de alunos"
            action: "Nao avancar para Fase 2 — diagnostico incompleto compromete tudo"
          - id: "VETO-004"
            name: "Situacao financeira critica"
            condition: "MRR inferior ao custo da plataforma"
            action: "Renegociar condicoes ou aguardar crescimento minimo"
      next: "phase-2"

    # =====================================================
    # PHASE 2: Offer Design (Dias 3-5)
    # =====================================================
    - id: "phase-2"
      name: "Offer Design"
      agent: "gym-scaler"
      checkpoint_id: "FC-CP-ONBOARD-002"
      duration: "3 dias"
      timeline: "Dias 3-5"
      task: "offer-design.md"
      framework: "Alex Hormozi — $100M Offers, Value Equation"
      objectives:
        - "Redesenhar ofertas usando a Value Equation de Hormozi"
        - "Criar stack de valor com bonuses e diferenciais claros"
        - "Definir pricing em 3 tiers (Basico, Premium, VIP)"
        - "Criar garantia de resultado (risk-reversal)"
        - "Calcular LTV projetado por tier e revenue mix target"
      inputs:
        - "business-diagnostic-report.md (Phase 1)"
        - "current-state-analysis.md (Phase 1)"
        - "Precificacao atual de todos os servicos"
        - "Depoimentos de alunos (screenshots)"
        - "Certificacoes e formacoes do coach"
        - "Provas sociais disponiveis"
        - "Margem operacional aceitavel"
      steps:
        - id: "2.1"
          name: "Workshop Value Equation"
          duration: "3 horas com o coach"
          description: >-
            Aplicar Value Equation de Hormozi nos 4 eixos:
            Dream Outcome, Perceived Likelihood, Time Delay, Effort & Sacrifice.
            Para cada eixo: o que o coach ja tem e o que pode melhorar.
        - id: "2.2"
          name: "Inventario de Entregaveis Atuais"
          description: >-
            Listar TUDO que o coach entrega hoje. Quantificar o valor de cada
            entregavel separadamente.
        - id: "2.3"
          name: "Criacao do Offer Stack"
          description: >-
            Estruturar entregaveis em stack de valor irrecusavel:
            Core Offer + Bonuses. Calcular valor percebido total vs preco real.
        - id: "2.4"
          name: "Definicao dos 3 Tiers de Pricing"
          tiers:
            - name: "Basico (Self-Guided)"
              price_target: "R$97-197/mes"
              includes: "Acesso a plataforma, treinos pre-programados, suporte FAQ"
              objective: "Capturar leads, upsell futuro"
            - name: "Premium (Acompanhamento Ativo)"
              price_target: "R$397-697/mes"
              includes: "Treinos 100% personalizados, dieta, check-in semanal, suporte mensagem"
              objective: "Core do negocio, maior volume"
            - name: "VIP (Acesso Total)"
              price_target: "R$1.197-1.997/mes"
              includes: "Tudo do Premium + WhatsApp direto, coaching quinzenal 1:1, revisao 24h"
              objective: "Poucos alunos, alta margem, testimonials de elite"
        - id: "2.5"
          name: "Naming Persuasivo dos Planos"
          description: >-
            Evitar nomes genericos. Criar nomes que remetem ao resultado
            (ex: 'Startup Fit', 'Transformacao Real', 'Elite Body').
        - id: "2.6"
          name: "Design da Garantia (Risk-Reversal)"
          options:
            - "Garantia de Satisfacao 7 dias"
            - "Garantia de Resultado 30 dias"
            - "Garantia de Experiencia (resposta em X horas)"
            - "Garantia Bold Hormozi-style (resultado ou nao paga)"
          rules:
            - "Deve ser especifica"
            - "Deve ser matematicamente sustentavel"
            - "Deve ter condicoes claras"
        - id: "2.7"
          name: "Calculo de LTV Projetado"
          description: "Para cada tier: retencao media esperada, receita total, CAC estimado, LTV/CAC ratio."
        - id: "2.8"
          name: "Construcao do Revenue Mix Target"
          description: "Distribuicao ideal de alunos por tier para atingir meta de MRR."
      outputs:
        - name: "offer-stack.md"
          description: "Cada plano com todos os entregaveis e valores"
        - name: "pricing-strategy.md"
          description: "Justificativa de precos e projecoes"
        - name: "guarantee-terms.md"
          description: "Garantia detalhada com condicoes"
        - name: "sales-page-copy-draft.md"
          description: "Rascunho do texto de vendas para cada plano"
        - name: "ltv-calculator.xlsx"
          description: "Projecoes de receita por tier"
        - name: "revenue-mix-target.md"
          description: "Distribuicao ideal de alunos por tier"
      checkpoint:
        id: "FC-CP-ONBOARD-002"
        name: "Offer Design Complete Gate"
        type: "blocking"
        approvers: ["gym-scaler", "fitcoach-chief"]
        criteria:
          - "3 tiers de pricing definidos e documentados"
          - "Offer stack completo para cada tier (core + bonuses)"
          - "Garantia definida com condicoes claras"
          - "Naming dos planos criado e aprovado pelo coach"
          - "LTV projetado calculado para cada tier"
          - "Revenue mix target alinhado com metas da Fase 1"
          - "Copy de vendas rascunhado para pelo menos o tier Premium"
          - "Coach aprovou a nova estrutura de precos"
          - "Nenhuma Veto Condition ativa"
        veto_conditions:
          - id: "VETO-005"
            name: "Precificacao abaixo do custo"
            condition: "Tier Basico precificado abaixo dos custos operacionais"
            action: "Recalcular antes de avancar"
          - id: "VETO-006"
            name: "Ausencia de garantia"
            condition: "Nenhuma garantia definida"
            action: "Definir pelo menos garantia de satisfacao 7 dias"
          - id: "VETO-007"
            name: "Excesso de tiers"
            condition: "Coach insiste em mais de 5 opcoes de plano"
            action: "Bloquear — maximo absoluto: 3 tiers"
          - id: "VETO-008"
            name: "LTV/CAC abaixo de 3x"
            condition: "Projecoes mostram LTV/CAC < 3x em qualquer tier"
            action: "Revisar preco ou estrategia de reducao de churn"
      next: "phase-3"

    # =====================================================
    # PHASE 3: Client Migration (Dias 5-7)
    # =====================================================
    - id: "phase-3"
      name: "Client Migration"
      agents: ["fitcoach-chief", "automation-engineer"]
      checkpoint_id: "FC-CP-ONBOARD-003"
      duration: "3 dias"
      timeline: "Dias 5-7"
      tasks: ["client-migration.md", "communication-templates.md"]
      objectives:
        - "Migrar 100% dos alunos ativos para a plataforma"
        - "Preservar historico de treinos, dietas e progresso"
        - "Comunicar a transicao de forma positiva"
        - "Manter ou aumentar engajamento durante a transicao"
        - "Identificar e tratar casos de resistencia individualmente"
      inputs:
        - "client-database-raw.csv (Phase 1)"
        - "offer-stack.md (Phase 2)"
        - "Historico de treinos e avaliacoes por aluno"
        - "Fotos de progresso (com permissao)"
        - "Dados de anamnese existentes"
      steps:
        - id: "3.1"
          name: "Segmentacao da Base para Migracao"
          segments:
            grupo_a:
              name: "Evangelistas (TOP 20%)"
              strategy: "Migrar PRIMEIRO, usar como beta testers"
              communication: "Convidar para programa exclusivo de pioneiros"
              benefit: "1 mes de desconto ou upgrade temporario"
            grupo_b:
              name: "Ativos Satisfeitos (60%)"
              strategy: "Migrar na sequencia do Grupo A"
              communication: "E-mail + WhatsApp com beneficios da mudanca"
            grupo_c:
              name: "Em Risco (20%)"
              strategy: "Migrar por ultimo, com atencao especial"
              communication: "Chamada 1:1 com o coach antes da migracao"
              objective: "Usar migracao como oportunidade de reengajamento"
        - id: "3.2"
          name: "Criacao dos Templates de Comunicacao"
          description: "Para cada canal (WhatsApp, email), criar templates personalizaveis de anuncio e follow-up."
        - id: "3.3"
          name: "Mapeamento de Dados por Aluno"
          description: >-
            Coletar e estruturar para cada aluno: dados pessoais, objetivo, restricoes,
            historico de treinos (4 semanas), historico de dieta, avaliacoes, preferencias.
            Formato: JSON por aluno para importacao em lote.
        - id: "3.4"
          name: "Configuracao de Perfis na Plataforma"
          description: "Criar usuarios, associar a planos, upload de fotos, preencher anamnese, vincular treinos."
        - id: "3.5"
          name: "Importacao de Dados Historicos"
          priority:
            - "Avaliacao fisica mais recente (obrigatorio)"
            - "Treino atual (obrigatorio)"
            - "Dieta atual (obrigatorio)"
            - "Ultimas 4 avaliacoes anteriores (se disponivel)"
            - "Fotos de progresso (com permissao explicita)"
            - "Historico completo de treinos (opcional)"
        - id: "3.6"
          name: "Envio de Mensagens de Boas-Vindas"
          description: "Enviar link de acesso via WhatsApp, email de boas-vindas com tutorial. Verificar acesso em 24h."
        - id: "3.7"
          name: "Calls de Transicao com Top 20%"
          description: "Video call 30min: mostrar plataforma ao vivo, coletar feedback, pedir indicacao."
        - id: "3.8"
          name: "Periodo de Suporte Intensivo (7 dias)"
          description: >-
            Coach em horario estendido, automation-engineer responde erros em <2h,
            checklist diario de alunos sem acesso, daily standup de 15 min.
      outputs:
        - name: "migration-plan.md"
          description: "Cronograma e responsaveis por aluno"
        - name: "communication-templates/"
          description: "WhatsApp, email, scripts de ligacao"
        - name: "client-database-structured.csv"
          description: "Pronta para importacao"
        - name: "client-profiles/*.json"
          description: "Um por aluno, para importacao em lote"
        - name: "migration-report.md"
          description: "Status por aluno, taxa de sucesso"
        - name: "migration-feedback.md"
          description: "Respostas dos alunos Grupo A"
      checkpoint:
        id: "FC-CP-ONBOARD-003"
        name: "Migration Complete Gate"
        type: "blocking"
        approvers: ["fitcoach-chief", "automation-engineer"]
        criteria:
          - "100% dos alunos com perfil criado na plataforma"
          - "Pelo menos 80% dos alunos acessaram a plataforma ao menos uma vez"
          - "Todos os alunos tem treino atual carregado na plataforma"
          - "Templates de comunicacao aprovados pelo coach"
          - "Taxa de cancelamento durante migracao menor que 10%"
          - "Calls com Top 20% realizadas"
          - "Relatorio de migracao produzido"
          - "Suporte intensivo de 7 dias concluido"
          - "Compliance LGPD verificada para dados sensiveis"
        veto_conditions:
          - id: "VETO-009"
            name: "Perda excessiva na migracao"
            condition: "Mais de 10% dos alunos cancelaram durante a migracao"
            action: "Pausar, analisar causa raiz, corrigir"
          - id: "VETO-010"
            name: "Dados historicos criticos incompletos"
            condition: "Coach nao tem nenhum registro de treinos anteriores"
            action: "Completar anamnese digital com cada aluno antes de migrar"
          - id: "VETO-011"
            name: "Consentimento LGPD ausente"
            condition: "Fotos e dados sensiveis sem consentimento explicito"
            action: "Coletar compliance LGPD antes de importar"
      next: "phase-4"

    # =====================================================
    # PHASE 4: Platform Setup (Dias 7-10)
    # =====================================================
    - id: "phase-4"
      name: "Platform Setup"
      agent: "fitcoach-chief"
      checkpoint_id: "FC-CP-ONBOARD-004"
      duration: "4 dias"
      timeline: "Dias 7-10"
      tasks: ["platform-config.md", "exercise-library-setup.md", "branding-setup.md"]
      objectives:
        - "Personalizar plataforma com branding do coach"
        - "Construir biblioteca de exercicios com videos proprios"
        - "Criar templates de treino por objetivo e frequencia"
        - "Criar templates de dieta por perfil nutricional"
        - "Configurar formulario de anamnese completo"
        - "Setup de dashboard de metricas e KPIs"
        - "Testar fluxo completo como aluno-teste"
      inputs:
        - "Logo e materiais de branding"
        - "Videos de exercicios gravados"
        - "Lista de exercicios mais usados"
        - "Modelos de treino existentes"
        - "Modelos de dieta existentes"
        - "business-diagnostic-report.md"
      steps:
        - id: "4.1"
          name: "Setup de Branding"
          description: >-
            Coletar logo, paleta de cores, tipografia, tom de voz, foto profissional.
            Aplicar na plataforma: header, emails, notificacoes, pagina de onboarding.
        - id: "4.2"
          name: "Construcao da Biblioteca de Exercicios"
          description: >-
            Para cada exercicio: nome, grupo muscular, nivel, equipamento, video (30-90s),
            instrucoes (3-5 pontos), erros comuns, variacoes.
            Prioridade: Top 20 exercicios mais prescritos.
          video_specs:
            format: "MP4 horizontal (16:9) ou vertical (9:16)"
            quality: "1080p minimo"
            duration: "30-90 segundos"
        - id: "4.3"
          name: "Criacao de Templates de Treino"
          by_objective: ["Emagrecimento", "Hipertrofia", "Condicionamento", "Manutencao", "Reabilitacao", "Competicao"]
          by_frequency: ["2x/semana", "3x/semana", "4x/semana", "5-6x/semana"]
          by_equipment: ["Academia completa", "Academia basica", "Casa sem equipamento", "Casa com equipamento basico"]
        - id: "4.4"
          name: "Criacao de Templates de Dieta/Nutricao"
          profiles: ["Deficit calorico", "Superavit hipertrofia", "Manutencao TDEE", "Low-carb/Keto", "Vegetariano/Vegano", "Intolerante lactose/gluten"]
        - id: "4.5"
          name: "Configuracao da Anamnese Digital"
          blocks:
            - "Bloco 1: Dados Pessoais"
            - "Bloco 2: Historico de Saude"
            - "Bloco 3: Experiencia Fitness"
            - "Bloco 4: Objetivos"
