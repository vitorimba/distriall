      condition: "Diagnostico incompleto"
      action: "Nao avancar para Fase 2"
    - id: "VETO-004"
      phase: 1
      condition: "MRR < custo da plataforma"
      action: "Renegociar ou aguardar crescimento"
    - id: "VETO-005"
      phase: 2
      condition: "Preco abaixo do custo operacional"
      action: "Recalcular pricing"
    - id: "VETO-006"
      phase: 2
      condition: "Sem garantia definida"
      action: "Obrigatorio ter risk-reversal"
    - id: "VETO-007"
      phase: 2
      condition: "Mais de 3 tiers"
      action: "Simplificar para maximo 3"
    - id: "VETO-008"
      phase: 2
      condition: "LTV/CAC < 3x"
      action: "Revisar estrategia"
    - id: "VETO-009"
      phase: 3
      condition: "Perda > 10% de alunos"
      action: "Pausar e investigar"
    - id: "VETO-010"
      phase: 3
      condition: "Sem historico de treinos"
      action: "Completar anamnese primeiro"
    - id: "VETO-011"
      phase: 3
      condition: "Sem consentimento LGPD"
      action: "Coletar permissao explicita"
    - id: "VETO-012"
      phase: 4
      condition: "Biblioteca de exercicios vazia"
      action: "Usar genericos + agendar gravacao"
    - id: "VETO-013"
      phase: 4
      condition: "Sem branding"
      action: "Usar foto profissional temporaria"
    - id: "VETO-014"
      phase: 4
      condition: "Bugs criticos nos testes"
      action: "Corrigir antes de avancar"
    - id: "VETO-015"
      phase: 5
      condition: "API WhatsApp nao aprovada"
      action: "Usar alternativa temporaria"
    - id: "VETO-016"
      phase: 5
      condition: "Automacoes nao testadas"
      action: "Bloquear ativacao"
    - id: "VETO-017"
      phase: 6
      condition: "Pontos sem recompensas reais"
      action: "Minimo 3 recompensas concretas"
    - id: "VETO-018"
      phase: 6
      condition: "Ranking sem privacidade"
      action: "Implementar opt-out antes de ativar"
    - id: "VETO-019"
      phase: 7
      condition: "Pagamento sem teste"
      action: "Executar transacao de R$1"
    - id: "VETO-020"
      phase: 7
      condition: "Produto fisico sem logistica"
      action: "Definir processo antes de listar"
    - id: "VETO-021"
      phase: 8
      condition: "Beta NPS < 20"
      action: "Segundo ciclo de beta"
    - id: "VETO-022"
      phase: 8
      condition: "Adocao D3 < 30%"
      action: "Suporte intensivo coach para alunos"

  # =====================================================
  # QUALITY GATES
  # =====================================================
  quality_gates:
    - id: "QG-001"
      name: "Assessment to Offer Design"
      transition: "phase-1 -> phase-2"
      criteria:
        - "Diagnostico completo + metas aprovados"
    - id: "QG-002"
      name: "Offer Design to Migration"
      transition: "phase-2 -> phase-3"
      criteria:
        - "3 tiers + garantia definidos"
    - id: "QG-003"
      name: "Migration to Platform Setup"
      transition: "phase-3 -> phase-4"
      criteria:
        - "80% alunos migrados"
    - id: "QG-004"
      name: "Platform Setup to Automation"
      transition: "phase-4 -> phase-5"
      criteria:
        - "Plataforma configurada e testada"
    - id: "QG-005"
      name: "Automation to Gamification"
      transition: "phase-5 -> phase-6"
      criteria:
        - "10 fluxos ativos e testados"
    - id: "QG-006"
      name: "Gamification to E-commerce"
      transition: "phase-6 -> phase-7"
      criteria:
        - "Sistema de pontos + primeiro desafio"
    - id: "QG-007"
      name: "E-commerce to Launch"
      transition: "phase-7 -> phase-8"
      criteria:
        - "Loja com 5+ produtos, pagamento OK"
    - id: "QG-008"
      name: "Launch Complete"
      transition: "phase-8 -> monitoring"
      criteria:
        - "80% adocao + relatorio entregue"

  # =====================================================
  # TIMELINE
  # =====================================================
  timeline:
    week_1:
      - "Dia 1-2: [FASE 1] Business Assessment"
      - "Dia 3-5: [FASE 2] Offer Design"
      - "Dia 5-7: [FASE 3] Client Migration (inicio)"
    week_2:
      - "Dia 7-10: [FASE 4] Platform Setup"
      - "Dia 10-12: [FASE 5] Automation Config"
      - "Dia 12-14: [FASE 6] Gamification Setup"
    week_3:
      - "Dia 14-17: [FASE 7] E-commerce Setup"
      - "Dia 17: [SOFT LAUNCH] Beta Testers"
      - "Dia 17-19: Ajustes pos-beta"
      - "Dia 21: [FULL LAUNCH] Todos os alunos"
    week_4_plus:
      - "Dia 21-28: Monitoramento intensivo (semana 1 pos-launch)"
      - "Dia 28-51: Monitoramento regular (semanas 2-4)"
      - "Dia 51: Relatorio final de onboarding"

  # =====================================================
  # HANDOFF TEMPLATE
  # =====================================================
  handoff_template:
    from_agent: "{agent_atual}"
    to_agent: "{proximo_agent}"
    story_context:
      coach_name: "{nome do coach}"
      onboarding_id: "FC-WF-004-{data}"
      current_phase: "{fase atual}"
      next_phase: "{proxima fase}"
    completed_outputs:
      - "{output 1 gerado}"
    key_decisions:
      - "{decisao importante tomada}"
    open_items:
      - "{item pendente para o proximo agent}"
    blockers: []
    next_action: "{primeira acao do proximo agent}"

  # =====================================================
