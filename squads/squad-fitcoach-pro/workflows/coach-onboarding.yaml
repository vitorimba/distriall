          - "Todos os fluxos testados com aluno-teste"
          - "Coach recebeu treinamento de como monitorar automacoes"
          - "FAQ automatico configurado com pelo menos 5 respostas"
        veto_conditions:
          - id: "VETO-015"
            name: "API WhatsApp nao aprovada"
            condition: "Meta nao aprovou templates em 5 dias uteis"
            action: "Usar solucao alternativa (Telegram bot ou SMS) temporariamente"
          - id: "VETO-016"
            name: "Automacoes nao testadas"
            condition: "Automacao entrando em producao sem teste"
            action: "Bloquear ativacao ate todos os fluxos serem validados"
