    # =====================================================
    # PHASE 5: Automation Config (Dias 10-12)
    # =====================================================
    - id: "phase-5"
      name: "Automation Config"
      agent: "automation-engineer"
      checkpoint_id: "FC-CP-ONBOARD-005"
      duration: "3 dias"
      timeline: "Dias 10-12"
      tasks: ["setup-whatsapp-automation.md", "setup-email-marketing.md"]
      objectives:
        - "Integrar API do WhatsApp Business com a plataforma"
        - "Criar fluxos de mensagens automaticas para todos os eventos"
        - "Configurar triggers de check-in semanal"
        - "Setup de email marketing segmentado"
        - "Automacao de lembretes de treino e dieta"
        - "Configurar alertas proativos para o coach"
      inputs:
        - "Numero WhatsApp Business do coach"
        - "Acesso ao Meta Business Manager"
        - "Top 10 FAQs dos alunos"
        - "Horarios de treino por aluno"
        - "Datas de aniversario dos alunos"
      steps:
        - id: "5.1"
          name: "Integracao WhatsApp Business API"
          prerequisites:
            - "Numero dedicado para o negocio"
            - "Meta Business Manager configurado"
            - "Numero verificado na API"
          setup:
            - "Webhook de recebimento de mensagens"
            - "Templates de mensagem aprovados pela Meta (24-48h)"
            - "Fluxos de resposta automatica"
            - "Horario de atendimento automatico"
        - id: "5.2"
          name: "Criacao dos 10 Fluxos de Automacao Principais"
          flows:
            - name: "Boas-Vindas ao Novo Aluno"
              trigger: "Aluno completa cadastro e anamnese"
              delay: "imediato"
            - name: "Lembrete de Treino"
              trigger: "Dia de treino do aluno"
              delay: "2h antes do horario preferido"
            - name: "Confirmacao de Treino Realizado"
              trigger: "Aluno marca check-in"
              action: "Atribuir pontos de gamificacao"
            - name: "Alerta de Treino Perdido"
              trigger: "Dia de treino passou sem check-in"
              delay: "2h apos horario usual"
            - name: "Inatividade (2 dias)"
              trigger: "Aluno nao acessa por 2 dias"
              action: "Marcar como 'atencao' no dashboard"
            - name: "Inatividade Critica (5 dias)"
              trigger: "Aluno nao acessa por 5 dias"
              action: "ALERTA para o coach"
            - name: "Check-in Semanal"
              trigger: "Domingo, 18h (configuravel)"
            - name: "Renovacao Proxima (15 dias)"
              trigger: "15 dias antes do vencimento"
            - name: "Aniversario do Aluno"
              trigger: "Data de aniversario"
              action: "Bonus de pontos ou desconto"
            - name: "Conquista Desbloqueada"
              trigger: "Aluno alcanca milestone"
        - id: "5.3"
          name: "Configuracao de Email Marketing"
          drip_campaign:
            - email: 1
              when: "Imediato"
              subject: "Bem-vindo!"
              objective: "Confirmacao e acesso"
            - email: 2
              when: "Dia 2"
              subject: "Seu plano de 30 dias comeca aqui"
              objective: "Orientacao inicial"
            - email: 3
              when: "Dia 5"
              subject: "Como usar a plataforma (tutorial)"
              objective: "Educacao do usuario"
            - email: 4
              when: "Dia 10"
              subject: "Seus primeiros 10 dias de resultado"
              objective: "Engajamento"
            - email: 5
              when: "Dia 21"
              subject: "Ja imaginou onde estara em 90 dias?"
              objective: "Retencao"
            - email: 6
              when: "Dia 30"
              subject: "1 mes de jornada — hora de avaliar!"
              objective: "Feedback + renovacao"
        - id: "5.4"
          name: "Automacao de Envio de Treinos e Dietas"
          description: "Notificacao push + WhatsApp + email para novos treinos. Dieta semanal no domingo a noite."
        - id: "5.5"
          name: "Configuracao de Alertas para o Coach"
          alerts:
            - "Aluno inativo ha 2 dias (WhatsApp)"
            - "Aluno inativo ha 5 dias (WhatsApp + email — URGENTE)"
            - "Aluno solicitou suporte"
            - "Plano vencendo em 3 dias sem renovacao"
            - "Novo aluno cadastrado"
            - "Pagamento nao processado"
            - "Aluno completou 10 treinos consecutivos (oportunidade de upgrade)"
            - "Aluno atingiu meta de peso (oportunidade de upsell)"
        - id: "5.6"
          name: "Configuracao de Respostas Automaticas para FAQs"
          description: "Top 10 perguntas frequentes com respostas automaticas e escalada para o coach se necessario."
      outputs:
