    # =====================================================
    # PHASE 6: Gamification Setup (Dias 12-14)
    # =====================================================
    - id: "phase-6"
      name: "Gamification Setup"
      agents: ["gamification-designer", "retention-engineer"]
      checkpoint_id: "FC-CP-ONBOARD-006"
      duration: "3 dias"
      timeline: "Dias 12-14"
      tasks: ["setup-gamification.md", "hook-model-config.md"]
      frameworks: ["Yu-kai Chou — Octalysis Framework", "Nir Eyal — Hooked (Hook Model)"]
      objectives:
        - "Implementar sistema de pontos com logica de progressao"
        - "Criar niveis de evolucao (do iniciante ao atleta elite)"
        - "Configurar desafios mensais motivadores"
        - "Setup de rankings e leaderboards (com privacidade)"
        - "Criar sistema de badges e conquistas"
        - "Integrar com Hook Model para criar habitos"
      inputs:
        - "Identidade visual do coach (Phase 4)"
        - "Nome e tom de voz da marca (Phase 4)"
        - "Lista de comportamentos desejados dos alunos"
        - "Orcamento para premios do desafio mensal"
      steps:
        - id: "6.1"
          name: "Design do Sistema de Pontos"
          core_drive: "Accomplishment"
          point_actions:
            - action: "Completar treino e fazer check-in"
              points: 100
              max_frequency: "1x/dia"
            - action: "Completar sequencia de 7 dias"
              points: 500
              max_frequency: "1x/semana"
            - action: "Completar sequencia de 30 dias"
              points: 2500
              max_frequency: "1x/mes"
            - action: "Preencher check-in semanal"
              points: 50
              max_frequency: "1x/semana"
            - action: "Registrar avaliacao de peso"
              points: 75
              max_frequency: "1x/semana"
            - action: "Fazer upload de foto de progresso"
              points: 150
              max_frequency: "1x/semana"
            - action: "Completar anamnese"
              points: 200
              max_frequency: "1x"
            - action: "Responder pesquisa NPS"
              points: 100
              max_frequency: "1x/trimestre"
            - action: "Indicar um amigo (que assina)"
              points: 1000
              max_frequency: "Ilimitado"
            - action: "Completar desafio mensal"
              points: 1500
              max_frequency: "1x/mes"
            - action: "Primeiro treino da semana"
              points: 25
              max_frequency: "1x/semana"
        - id: "6.2"
          name: "Criacao dos Niveis de Progressao"
          description: >-
            8 niveis com nomenclatura personalizada por coach.
            Para cada nivel: nome, descricao, pontos, badge visual, beneficio real.
          example_levels:
            - level: 1
              range: "0 - 999 pts"
              example_name: "Recruta / Iniciante"
            - level: 2
              range: "1.000 - 2.999 pts"
              example_name: "Soldado / Consistente"
            - level: 3
              range: "3.000 - 6.999 pts"
              example_name: "Cabo / Dedicado"
            - level: 4
              range: "7.000 - 14.999 pts"
              example_name: "Sargento / Comprometido"
            - level: 5
              range: "15.000 - 29.999 pts"
              example_name: "Tenente / Transformado"
            - level: 6
              range: "30.000 - 59.999 pts"
              example_name: "Capitao / Inspiracao"
            - level: 7
              range: "60.000 - 99.999 pts"
              example_name: "Coronel / Exemplo"
            - level: 8
              range: "100.000+ pts"
              example_name: "General / Lenda"
        - id: "6.3"
          name: "Configuracao do Sistema de Badges"
          categories:
            frequency: ["Primeiro Treino", "7 Seguidos", "Maratonista", "Iron Will"]
            result: ["Primeiros 5kg", "Primeiro Centimetro", "Metamorfose"]
            engagement: ["Aluno Nota 10", "Deu o Feedback", "Comunidade"]
            coach_exclusive: "Personalizar com metodologia do coach"
        - id: "6.4"
          name: "Configuracao de Rankings e Leaderboards"
          types:
            - "Ranking Geral (all-time)"
            - "Ranking do Mes (reset mensal)"
            - "Ranking de Consistencia (streaks)"
            - "Ranking do Desafio (por desafio)"
          privacy:
            - "Opcao de apelido ou iniciais"
            - "Opcao de opt-out completo"
            - "Coach ve todos os dados"
        - id: "6.5"
          name: "Design do Primeiro Desafio Mensal"
          example:
            name: "30 Dias de Transformacao"
            objective: "Completar 20 treinos + todos os check-ins + avaliacao inicio e fim"
            rewards:
              completers: "Badge + 1.500 pts"
              top_3: "Premio fisico ou desconto exclusivo"
              social: "Coach faz post dedicado no Instagram"
        - id: "6.6"
          name: "Implementacao do Hook Model"
          hook_cycle:
            trigger:
              external: "Notificacao push, WhatsApp, email"
              internal: "Habito formado com o tempo"
            action: "Tornar acoes simples (check-in 1 toque, <3 taps para treino)"
            variable_reward: "Pontos variaveis, badges surpresa, ranking que muda"
            investment: "Historico, pontos, nivel, streak — custo de saida crescente"
        - id: "6.7"
          name: "Calibracao de Dificuldade (Flow State)"
          progression:
            level_1_to_2: "1-2 semanas (rapido, para enganchar)"
            level_2_to_3: "3-4 semanas (consolidando habito)"
            level_3_plus: "Progressivamente mais lento"
            first_badge: "Dentro da primeira semana"
            first_challenge: "Dentro do primeiro mes"
      outputs:
        - name: "gamification-spec.md"
          description: "Logica completa de pontos e niveis"
        - name: "badges-catalog.md"
          description: "Todos os badges com criterios"
        - name: "first-challenge.md"
          description: "Desafio mensal pronto para lancar"
        - name: "hook-model-config.md"
          description: "Triggers, actions e rewards configurados"
        - name: "gamification-test-report.md"
          description: "Validacao de funcionamento"
      checkpoint:
        id: "FC-CP-ONBOARD-006"
        name: "Gamification Complete Gate"
        type: "blocking"
        approvers: ["gamification-designer", "retention-engineer"]
        criteria:
          - "Sistema de pontos configurado com pelo menos 8 tipos de acoes"
          - "Pelo menos 6 niveis de progressao com nomes personalizados"
          - "Pelo menos 10 badges criados com criterios claros"
          - "Primeiro desafio mensal configurado e pronto"
          - "Rankings configurados com opcao de privacidade"
          - "Hook Model implementado (triggers externos funcionando)"
          - "Sistema testado com aluno-teste"
          - "Coach treinado em como usar gamificacao"
        veto_conditions:
          - id: "VETO-017"
            name: "Pontos sem recompensas reais"
            condition: "Nenhuma recompensa tangivel configurada"
            action: "Configurar pelo menos 3 recompensas concretas"
          - id: "VETO-018"
            name: "Ranking sem opcao de privacidade"
            condition: "Nomes completos expostos sem consentimento"
            action: "Implementar opcao de apelido/opt-out"
      next: "phase-7"

    # =====================================================
    # PHASE 7: E-commerce Setup (Dias 14-17)
    # =====================================================
    - id: "phase-7"
      name: "E-commerce Setup"
      agent: "ecommerce-manager"
      checkpoint_id: "FC-CP-ONBOARD-007"
      duration: "4 dias"
      timeline: "Dias 14-17"
      tasks: ["ecommerce-setup.md", "product-catalog.md", "payment-config.md"]
      objectives:
        - "Configurar loja integrada na plataforma"
        - "Catalogar e listar primeiros produtos (fisicos e digitais)"
        - "Integrar gateways de pagamento"
        - "Configurar logistica para produtos fisicos"
        - "Configurar sistema de comissionamento"
        - "Criar primeira campanha de lancamento da loja"
      inputs:
        - "Lista de produtos que o coach quer vender"
        - "Fotos dos produtos"
        - "Precificacao desejada"
        - "CNPJ e dados bancarios PJ"
        - "Politica de reembolso"
      steps:
        - id: "7.1"
          name: "Definicao do Mix de Produtos"
          categories:
            digital:
              items: ["Programas de treino PDF/video", "E-books de nutricao", "Planilhas de dieta", "Workshops gravados", "Mentorias em grupo", "Consultorias avulsas"]
              margin: "Alta (sem logistica)"
            supplements:
              items: ["Proteinas", "Creatina/glutamina/BCAAs", "Pre-treinos", "Vitaminas", "Barras de proteina"]
              margin: "Media (logistica)"
              note: "Verificar revenda autorizada e CNPJ"
            branded:
              items: ["Camisetas/vestuario", "Garrafinhas/coqueteleiras", "Acessorios de treino", "Bones/moletons"]
              margin: "Variavel"
              note: "Producao por demanda ou estoque?"
            services:
              items: ["Avaliacao fisica avulsa", "Revisao treino/dieta externo", "Plano para viagem", "Treino para evento especial"]
              margin: "Alta (sem estoque)"
        - id: "7.2"
          name: "Cadastro dos Primeiros Produtos"
          per_product: ["Nome comercial", "Descricao (beneficios)", "Preco + preco 'de'", "Fotos (min 3)", "Estoque/acesso", "Categoria e tags", "Produtos relacionados"]
          rule: "Comecar com 5-10 produtos de alta demanda"
        - id: "7.3"
          name: "Configuracao de Gateways de Pagamento"
          methods: ["Cartao credito (ate 12x)", "Cartao debito", "PIX (imediato)", "Boleto bancario"]
          gateway: "Mercado Pago, PagSeguro, ou Stripe"
          setup: ["Taxa de antecipacao", "Prazo de recebimento", "Politica de reembolso", "Nota fiscal automatica"]
        - id: "7.4"
          name: "Configuracao de Logistica (Produtos Fisicos)"
          setup: ["Local de armazenagem", "Tabela de fretes", "Limite para frete gratis", "Prazo de envio", "Rastreamento automatico"]
        - id: "7.5"
          name: "Sistema de Comissionamento (Affiliates)"
          setup: ["Links de indicacao personalizados", "Comissao 5-15%", "Painel de afiliados", "Materiais de divulgacao"]
        - id: "7.6"
          name: "Configuracao de Upsell e Cross-sell"
          triggers:
            - "Sugestao apos check-in de treino"
            - "Produto relacionado na pagina de cada item"
            - "Bundle com desconto"
            - "Email automatico apos 2 semanas sem compra"
        - id: "7.7"
          name: "Primeira Campanha de Lancamento"
          description: >-
            Data de lancamento (coincidir com Full Launch Fase 8).
            Oferta especial de inauguracao, comunicacao multicanal,
            meta de vendas para primeira semana.
      outputs:
        - name: "product-catalog.md"
          description: "Todos os produtos com descricao e preco"
        - name: "payment-config.md"
          description: "Gateways, taxas e prazos"
        - name: "logistics-plan.md"
          description: "Processo de envio de produtos fisicos"
        - name: "store-launch-plan.md"
          description: "Campanha de inauguracao"
        - name: "ecommerce-setup-report.md"
          description: "Status de todos os itens configurados"
      checkpoint:
        id: "FC-CP-ONBOARD-007"
        name: "E-commerce Complete Gate"
        type: "blocking"
        approvers: ["ecommerce-manager", "fitcoach-chief"]
        criteria:
          - "Loja configurada e acessivel na plataforma"
          - "Pelo menos 5 produtos listados e com fotos"
          - "Gateway de pagamento configurado e testado"
          - "PIX e cartao de credito funcionando"
          - "Politica de reembolso publicada"
          - "Upsell de pelo menos 1 produto configurado"
          - "Plano de lancamento da loja criado"
          - "Coach treinado em como gerenciar pedidos"
        veto_conditions:
          - id: "VETO-019"
            name: "Gateway de pagamento sem teste"
            condition: "Nenhuma transacao de teste completa"
            action: "Executar teste com R$1,00 antes de avancar"
          - id: "VETO-020"
            name: "Produto fisico sem logistica definida"
            condition: "Produto fisico listado sem processo de envio"
            action: "Definir logistica antes de listar"
      next: "phase-8"

    # =====================================================
    # PHASE 8: Launch & Monitoring (Dias 17-21+)
    # =====================================================
    - id: "phase-8"
      name: "Launch & Monitoring"
      agents: ["fitcoach-chief", "gym-operator"]
      checkpoint_id: "FC-CP-ONBOARD-008"
      duration: "5 dias + monitoramento continuo por 30 dias"
      timeline: "Dias 17-21 (launch) + Dias 21-51 (monitoring)"
      tasks: ["soft-launch.md", "full-launch.md", "monitoring-setup.md"]
      objectives:
        - "Executar soft launch com 5-10 alunos beta"
        - "Coletar feedback estruturado e ajustar"
        - "Planejar e executar full launch com comunicacao impactante"
        - "Monitorar metricas por 30 dias"
        - "Entregar relatorio de resultados vs baseline"
      inputs:
        - "Todos os outputs das fases 1-7"
        - "Lista de alunos beta"
        - "Video de apresentacao da plataforma"
        - "Ofertas de lancamento definidas"
      steps:
        - id: "8.1"
          name: "Selecao dos Beta Testers"
          criteria:
            - "Representatividade: incluir 1 de cada tier"
            - "Diversidade: tecnologicos e menos tecnologicos"
            - "Confianca: alunos que dao feedback honesto"
            - "Comprometimento: confirmaram disponibilidade de 48h"
        - id: "8.2"
          name: "Briefing com Beta Testers"
          format: "Reuniao 30 min (video call ou presencial)"
          beta_checklist:
            - "Fazer login e completar perfil"
            - "Acessar e executar o primeiro treino"
            - "Fazer check-in na plataforma"
            - "Verificar treino correto e atualizado"
            - "Responder check-in semanal"
            - "Acessar loja e navegar produtos"
            - "Testar notificacoes de lembrete"
            - "Testar chat com o coach"
            - "Avaliar experiencia geral (NPS)"
        - id: "8.3"
          name: "Monitoramento do Soft Launch (5 dias)"
          protocol:
            - "Daily standup de 15 min para revisar feedback"
            - "fitcoach-chief monitora dashboard em tempo real"
            - "Bug critico: corrigido em menos de 4 horas"
            - "UX confuso: documentado e priorizado"
            - "NPS coletado no dia 5"
        - id: "8.4"
          name: "Ajustes Pos-Beta"
          description: "Listar ajustes, priorizar por impacto vs esforco, executar criticos antes do full launch."
        - id: "8.5"
          name: "Preparacao do Full Launch"
          materials:
            - "Video do coach apresentando a plataforma (1-2 min)"
            - "Screenshots de depoimentos dos betas"
            - "Tutorial de como se cadastrar (2-3 min)"
            - "FAQ de lancamento (5 duvidas)"
          teasers:
            - "Redes sociais do coach ('Novidade vem ai!')"
            - "Email de lancamento para todos os alunos"
            - "WhatsApp broadcast"
            - "Instagram Stories e Feed post"
            - "Oferta especial de lancamento"
        - id: "8.6"
          name: "Execucao do Full Launch (Dia D)"
          recommended: "Terca ou quarta-feira, entre 10h e 12h"
          timeline:
            "09:00": "fitcoach-chief confere plataforma 100% funcional"
            "10:00": "WhatsApp broadcast para todos os alunos"
            "10:05": "E-mail de lancamento disparado"
            "10:30": "Coach posta no Instagram Stories e Feed"
            "11:00": "Coach faz Instagram Live 20 min"
            "14:00": "WhatsApp follow-up para alunos que nao acessaram"
        - id: "8.7"
          name: "Monitoramento de KPIs (7 dias)"
          kpis:
            - metric: "Alunos que acessaram"
              target_d1: "30%"
              target_d3: "60%"
              target_d7: "80%"
            - metric: "Check-ins completados"
              target_d1: "20%"
              target_d3: "40%"
              target_d7: "60%"
            - metric: "Mensagens via plataforma"
              target_d1: "10+"
              target_d3: "30+"
              target_d7: "50+"
            - metric: "Vendas na loja"
              target_d1: "1+"
              target_d3: "3+"
              target_d7: "5+"
            - metric: "Cancelamentos/reclamacoes"
              target_d1: "0"
              target_d3: "<2"
              target_d7: "<3"
            - metric: "NPS"
              target_d7: ">30"
        - id: "8.8"
          name: "Monitoramento Continuo (30 dias)"
          weekly_reports:
            week_1: "Foco em adocao (quantos acessaram, bugs, UX)"
            week_2: "Foco em engajamento (check-ins, streaks, pontos)"
            week_3: "Foco em retencao (quem em risco de churn)"
            week_4: "Foco em resultados (NPS, renovacoes, upsell)"
        - id: "8.9"
          name: "Relatorio Final de Onboarding"
          sections:
            - "Resultados vs Baseline (Fase 1)"
            - "O que funcionou (Top 3 decisoes positivas)"
            - "O que ajustar (Top 3 melhorias)"
            - "Proximos passos (Roadmap 3 meses)"
      success_metrics:
        - metric: "Alunos na plataforma"
          baseline: "0%"
          target_d7: "80%"
          target_d30: "95%"
          target_d90: "100%"
        - metric: "Engagement rate semanal"
          baseline: "0%"
          target_d7: "55%"
          target_d30: "70%"
          target_d90: "75%"
        - metric: "Check-in completion rate"
          baseline: "0%"
          target_d7: "40%"
          target_d30: "60%"
          target_d90: "70%"
        - metric: "Churn rate mensal"
          baseline: "baseline"
          target_d7: "<8%"
          target_d30: "<5%"
          target_d90: "<3%"
        - metric: "NPS"
          baseline: "baseline"
          target_d7: ">30"
          target_d30: ">45"
          target_d90: ">60"
        - metric: "Ticket medio"
          baseline: "R$ X"
          target_d7: "+5%"
          target_d30: "+15%"
          target_d90: "+25%"
        - metric: "MRR"
          baseline: "R$ X"
          target_d7: "+5%"
          target_d30: "+20%"
          target_d90: "+50%"
        - metric: "Horas/semana do coach"
          baseline: "X horas"
          target_d7: "-10%"
          target_d30: "-25%"
          target_d90: "-40%"
        - metric: "Vendas e-commerce"
          baseline: "R$0"
          target_d7: "R$500+"
          target_d30: "R$2.000+"
          target_d90: "R$5.000+"
        - metric: "Pontuacao media gamificacao"
          baseline: "0"
          target_d7: "300+"
          target_d30: "800+"
          target_d90: "2.000+"
      outputs:
        - name: "beta-test-report.md"
          description: "Feedback dos betas e ajustes feitos"
        - name: "full-launch-plan.md"
          description: "Cronograma detalhado do dia D"
        - name: "metrics-report-d7.md"
          description: "KPIs da primeira semana"
        - name: "metrics-report-d30.md"
          description: "KPIs do primeiro mes"
        - name: "onboarding-results-report.md"
          description: "Resultados vs baseline + proximos passos"
      checkpoint:
        id: "FC-CP-ONBOARD-008"
        name: "Launch & Monitoring Complete Gate"
        type: "blocking"
        approvers: ["fitcoach-chief", "gym-operator"]
        criteria:
          - "Soft launch executado com pelo menos 5 beta testers"
          - "NPS do beta >= 20"
          - "Ajustes criticos implementados apos o beta"
          - "Full launch executado conforme plano"
          - "Pelo menos 80% dos alunos acessaram em 7 dias"
          - "Relatorio de metricas dia 7 produzido"
          - "Relatorio de metricas dia 30 produzido"
          - "Relatorio final de onboarding entregue ao coach"
          - "Coach apto a operar a plataforma independentemente"
          - "Proximo trimestre planejado (roadmap)"
        veto_conditions:
          - id: "VETO-021"
            name: "Beta NPS abaixo de 20"
            condition: "NPS dos beta testers inferior a 20"
            action: "Nao lancar — investigar, corrigir, segundo ciclo de beta"
          - id: "VETO-022"
            name: "Taxa de acesso D3 abaixo de 30%"
            condition: "Menos de 30% dos alunos acessaram ate dia 3"
            action: "Protocolo de suporte intensivo — coach liga para cada aluno"

  # =====================================================
  # VETO CONDITIONS CONSOLIDADAS
  # =====================================================
  veto_conditions_summary:
    - id: "VETO-001"
      phase: 1
      condition: "Menos de 5 alunos ativos"
      action: "Versao simplificada (Tier Starter)"
    - id: "VETO-002"
      phase: 1
      condition: "Instagram < 100 seguidores"
      action: "Incluir Fase 0 de Branding"
    - id: "VETO-003"
