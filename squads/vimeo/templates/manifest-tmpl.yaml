---
# Template: Download Manifest
# Usage: Generated by generate-manifest task after crawling a Vimeo URL.
# Tracks all videos to be downloaded and their statuses.

name: manifest-tmpl
type: template
squad: vimeo
used_by:
  - wf-download-batch
  - generate-manifest

---

manifest:
  # --- Source Info ---
  source_url: "{source_url}"
  source_type: "{source_type}"  # playlist | channel | showcase | album | single
  source_title: "{source_title}"
  crawled_at: "{timestamp}"
  generated_by: "vimeo-squad/generate-manifest"

  # --- Summary ---
  total_count: 0
  pending_count: 0
  completed_count: 0
  failed_count: 0
  skipped_count: 0
  total_size_mb: 0

  # --- Download Config ---
  config:
    quality: "{quality}"
    output_dir: "{output_dir}"
    transcribe: true
    auth_method: "{auth_method}"

  # --- Video Entries ---
  # Each entry tracks one video through the pipeline
  videos: []
  # Entry schema:
  #   - id: "{video_id}"               # Vimeo video ID
  #     url: "{video_url}"             # Full Vimeo URL
  #     title: "{video_title}"         # Video title
  #     duration: 0                    # Duration in seconds
  #     duration_formatted: "00:00:00" # HH:MM:SS
  #     uploader: "{uploader}"         # Channel/user name
  #     upload_date: "{upload_date}"   # YYYY-MM-DD
  #     description: "{description}"   # Video description (truncated)
  #     thumbnail: "{thumbnail_url}"   # Thumbnail URL
  #     status: "pending"              # pending | downloading | completed | failed | skipped
  #     output_path: ""                # Final file path after download
  #     transcript_path: ""            # Transcript file path
  #     file_size_mb: 0                # File size in MB
  #     format: ""                     # Downloaded format (e.g., mp4, webm)
  #     error: ""                      # Error message if failed
  #     started_at: ""                 # Download start timestamp
  #     completed_at: ""               # Download completion timestamp
  #     retry_count: 0                 # Number of retry attempts

  # --- Errors Log ---
  errors: []
  # Error schema:
  #   - video_id: "{video_id}"
  #     error_type: "{type}"           # network | auth | not_found | format | unknown
  #     message: "{message}"
  #     timestamp: "{timestamp}"
  #     recoverable: true
