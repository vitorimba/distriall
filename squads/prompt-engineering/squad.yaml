description: |
  Squad especializado em System Prompts e Prompt Engineering para Agentes de IA.
  Foco: criar prompts poderosos para agentes de atendimento, vendas, suporte e operacoes.
  Baseado em 8 elite minds com frameworks documentados e replicaveis.

objectives:
  - Criar system prompts de alta qualidade para agentes de IA
  - Selecionar a tecnica de prompting ideal para cada tipo de agente
  - Projetar personas e character design para agentes conversacionais
  - Estruturar prompts com frameworks replicaveis (CO-STAR, Five Principles)
  - Garantir seguranca e robustez dos prompts (prompt injection, guardrails)
  - Avaliar e iterar prompts com metricas objetivas

key_capabilities:
  - System prompt architecture for AI agents
  - Technique selection per agent type (sales, support, service)
  - Character and persona design
  - Prompt framework application (CO-STAR, RACE, Five Principles)
  - Agent behavior engineering (guardrails, escalation, tone)
  - Prompt security (injection prevention, safety)
  - Evaluation and iterative improvement
  - Context engineering for long-horizon agents

