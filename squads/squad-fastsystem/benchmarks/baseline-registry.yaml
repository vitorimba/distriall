# ============================================================================
# Baseline Registry — Squad FastSystem
# ============================================================================
# Registro de baselines de performance capturados por projeto
# ============================================================================

version: 1.0.0
description: >
  Registro central de baselines de performance. Cada entrada representa
  um snapshot de metricas capturado em um momento especifico para um
  projeto/sistema. Usado para comparacao antes/depois de otimizacoes.

# ============================================================================
# Template de Baseline Entry
# ============================================================================
template:
  project: "<project-name>"
  environment: "<production|staging>"
  captured_at: "<ISO-8601 timestamp>"
  captured_by: "<agent-name>"
  trigger: "<reason for baseline capture>"

  traffic:
    peak_rps: 0
    avg_rps: 0
    concurrent_users: 0
    daily_requests: 0

  api_performance:
    p50_ms: 0
    p95_ms: 0
    p99_ms: 0
    error_rate_pct: 0
    throughput_rps: 0

  web_vitals:
    lcp_ms: 0
    inp_ms: 0
    cls: 0
    fcp_ms: 0
    ttfb_ms: 0
    lighthouse_desktop: 0
    lighthouse_mobile: 0

  database:
    query_p95_ms: 0
    cache_hit_ratio_pct: 0
    active_connections: 0
    max_connections: 0
    replication_lag_ms: 0

  caching:
    hit_rate_pct: 0
    memory_used_mb: 0
    memory_max_mb: 0
    eviction_rate: 0
    latency_get_ms: 0

  infrastructure:
    cpu_avg_pct: 0
    cpu_peak_pct: 0
    memory_avg_pct: 0
    memory_peak_pct: 0
    disk_io_await_ms: 0
    instances: 0

  bundle:
    main_js_kb: 0
    total_js_kb: 0
    total_css_kb: 0
    total_images_kb: 0

  notes: "<additional context>"

# ============================================================================
# Baselines (append new entries below)
# ============================================================================
baselines: []
