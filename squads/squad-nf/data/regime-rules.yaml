    fator_r:
      description: "Fator R = Folha 12 meses / Receita 12 meses"
      threshold: 0.28
      effect: "Se >= 28%, empresas do Anexo V tributam pelo Anexo III"

    aliquota_efetiva_formula: "(RBT12 * AliqNom - PD) / RBT12"

    obligations:
      - name: "DAS"
        frequency: "mensal"
        deadline: "dia 20"
      - name: "DEFIS"
        frequency: "anual"
        deadline: "31 de marco"
      - name: "DESTDA"
        frequency: "mensal"
        deadline: "dia 28"
        notes: "Declaracao de ST, DIFAL e antecipacao"

    notes: "Aliquota efetiva = (RBT12 * Aliq - Deducao) / RBT12. Credito ICMS na NF = aliquota ICMS dentro da aliquota efetiva."

  # ---------------------------------------------------------------------------
  # LUCRO PRESUMIDO
  # ---------------------------------------------------------------------------
  - regime: presumido
    crt: 3
    display_name: "Lucro Presumido"
    faturamento_limite: 78000000  # R$/ano

    cst_icms:
      - code: "00"
        description: "Tributada integralmente"
        when: "Operacao normal com ICMS"
      - code: "10"
        description: "Tributada com ST"
        when: "Operacao com Substituicao Tributaria"
      - code: "20"
        description: "Com reducao de base de calculo"
        when: "Beneficio fiscal de reducao de BC"
      - code: "40"
        description: "Isenta"
        when: "Operacao isenta de ICMS"
      - code: "41"
        description: "Nao tributada"
        when: "Operacao fora da incidencia do ICMS"
      - code: "50"
        description: "Suspensao"
        when: "ICMS suspenso (ex: remessa para industrializacao)"
      - code: "51"
        description: "Diferimento"
        when: "ICMS diferido (recolhimento adiado)"
      - code: "60"
        description: "ICMS cobrado anteriormente por ST"
        when: "Revenda de mercadoria com ST ja paga"
      - code: "70"
        description: "Com reducao de BC e ST"
        when: "Reducao de BC + ST"
      - code: "90"
        description: "Outros"
        when: "Situacoes nao enquadradas"

    rates:
      pis: 0.65               # Cumulativo
      cofins: 3.00             # Cumulativo
      irpj_base_comercio: 8    # % sobre faturamento
      irpj_base_servico: 32    # % sobre faturamento
      irpj_aliquota: 15        # % sobre base presumida
      irpj_adicional: 10       # % sobre excedente de R$60k/trimestre
      csll_base_comercio: 12
      csll_base_servico: 32
      csll_aliquota: 9

    pis_cofins:
      regime: "cumulativo"
      credito: false
      cst_pis: "01"            # Operacao tributavel — base aliquota
      cst_cofins: "01"

    obligations:
      - name: "DCTF"
        frequency: "mensal"
        deadline: "15o dia util do 2o mes seguinte"
      - name: "EFD Contribuicoes"
        frequency: "mensal"
        deadline: "10o dia util do 2o mes seguinte"
      - name: "SPED Fiscal"
        frequency: "mensal"
        deadline: "dia 20 do mes seguinte"
        notes: "Obrigatorio para contribuintes ICMS"
      - name: "IRPJ/CSLL"
        frequency: "trimestral"
        deadline: "ultimo dia util do mes seguinte ao trimestre"
      - name: "ECF"
        frequency: "anual"
        deadline: "ultimo dia util de julho"

    notes: "PIS/COFINS cumulativo (sem creditos). IRPJ/CSLL trimestral sobre base presumida."

  # ---------------------------------------------------------------------------
  # LUCRO REAL
  # ---------------------------------------------------------------------------
  - regime: real
    crt: 3
    display_name: "Lucro Real"
    faturamento_limite: null   # Sem limite (obrigatorio acima de R$78M)

    cst_icms: "Mesmos CSTs do Lucro Presumido (00-90)"

    rates:
      pis: 1.65               # Nao-cumulativo
      cofins: 7.60             # Nao-cumulativo
      irpj_aliquota: 15
      irpj_adicional: 10       # Sobre excedente de R$20k/mes
      csll_aliquota: 9

    pis_cofins:
      regime: "nao_cumulativo"
      credito: true
      cst_saida: "01"          # Operacao tributavel
      cst_entrada_com_credito: "50"   # Com direito a credito
      cst_entrada_sem_credito: "70"   # Sem direito a credito
      cst_nao_tributada: "06"
      cst_isenta: "04"
      creditable_inputs:
        - "Bens para revenda"
        - "Insumos utilizados na producao"
        - "Energia eletrica"
        - "Alugueis de PJ"
        - "Depreciacao de maquinas"
        - "Frete sobre compras"
      non_creditable:
        - "Mao de obra (salarios)"
        - "Compras de PF"
        - "Bens do ativo (depreciar)"

    obligations:
      - name: "DCTF"
        frequency: "mensal"
        deadline: "15o dia util do 2o mes seguinte"
      - name: "EFD Contribuicoes"
        frequency: "mensal"
        deadline: "10o dia util do 2o mes seguinte"
      - name: "SPED Fiscal"
        frequency: "mensal"
        deadline: "dia 20 do mes seguinte"
      - name: "ECF"
        frequency: "anual"
        deadline: "ultimo dia util de julho"
      - name: "ECD (SPED Contabil)"
        frequency: "anual"
        deadline: "ultimo dia util de maio"
      - name: "IRPJ/CSLL"
        frequency: "trimestral ou mensal (estimativa)"
        deadline: "ultimo dia util do mes seguinte"
      - name: "LALUR/LACS"
        frequency: "anual"
        deadline: "Entregue via ECF"

    notes: "PIS/COFINS nao-cumulativo com creditos. IRPJ trimestral ou mensal por estimativa. Obrigatorio para faturamento > R$78M, instituicoes financeiras, e empresas com lucro do exterior."
