            aliquota: 7.80
            deducao: 5940
          - faixa: 3
            receita_ate: 720000
            aliquota: 10.00
            deducao: 13860
          - faixa: 4
            receita_ate: 1800000
            aliquota: 11.20
            deducao: 22500
          - faixa: 5
            receita_ate: 3600000
            aliquota: 14.70
            deducao: 87300
          - faixa: 6
            receita_ate: 4800000
            aliquota: 30.00
            deducao: 540000

      - anexo: "III"
