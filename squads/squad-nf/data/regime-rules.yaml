# =============================================================================
# Regime Rules — Tax Rules by Regime
# Squad: squad-nf
# Structure: regime, csts, rates, obligations, notes
# =============================================================================

regime_rules:
  # ---------------------------------------------------------------------------
  # MEI — Microempreendedor Individual
  # ---------------------------------------------------------------------------
  - regime: mei
    crt: 4
    display_name: "MEI — Microempreendedor Individual"
    faturamento_limite: 81000  # R$/ano
    employees_max: 1

    csosn_allowed:
      - code: "102"
        description: "Tributada sem permissao de credito"
        when: "Venda padrao MEI"
      - code: "300"
        description: "Imune"
        when: "Operacao imune (raro para MEI)"
      - code: "400"
        description: "Nao tributada"
        when: "Operacao nao tributada"
      - code: "500"
        description: "ICMS cobrado anteriormente por ST"
        when: "Revenda de produto com ST"

    rates:
      das_mensal:
        comercio: 71.60       # INSS + ICMS
        servico: 75.60        # INSS + ISS
        comercio_servico: 76.60  # INSS + ICMS + ISS
      icms: 1.00              # Fixo no DAS
      iss: 5.00               # Fixo no DAS

    nf_rules:
      obrigatoria_pj: true
      obrigatoria_pf: false
      modelo_permitido: [55, 65]

    obligations:
      - name: "DAS"
        frequency: "mensal"
        deadline: "dia 20"
      - name: "DASN-SIMEI"
        frequency: "anual"
        deadline: "31 de maio"

    notes: "MEI nao destaca impostos na NF. CRT=4. Nao gera credito ICMS."

  # ---------------------------------------------------------------------------
  # SIMPLES NACIONAL
  # ---------------------------------------------------------------------------
  - regime: simples
    crt: 1
    display_name: "Simples Nacional"
    faturamento_limite: 4800000  # R$/ano

    csosn_allowed:
      - code: "101"
        description: "Tributada com permissao de credito"
        when: "Venda para contribuinte ICMS que pode aproveitar credito"
      - code: "102"
        description: "Tributada sem permissao de credito"
        when: "Venda para consumidor final ou nao contribuinte"
      - code: "103"
        description: "Isencao do ICMS para faixa de receita bruta"
        when: "Microempresa com receita ate sublimite estadual"
      - code: "201"
        description: "Tributada com permissao de credito e com ST"
        when: "Venda com ST e credito permitido"
      - code: "202"
        description: "Tributada sem permissao de credito e com ST"
        when: "Venda com ST sem credito"
      - code: "203"
        description: "Isencao do ICMS para faixa e com ST"
        when: "Isento do ICMS proprio mas com ST"
      - code: "300"
        description: "Imune"
        when: "Operacao imune (ex: exportacao)"
      - code: "400"
        description: "Nao tributada"
        when: "Operacao nao tributada pelo ICMS"
      - code: "500"
        description: "ICMS cobrado anteriormente por ST ou antecipacao"
        when: "Revenda de mercadoria com ST ja recolhida"
      - code: "900"
        description: "Outros"
        when: "Situacoes nao enquadradas nos anteriores"

    anexos:
      - anexo: "I"
        atividade: "Comercio"
        faixas:
          - faixa: 1
            receita_ate: 180000
            aliquota: 4.00
            deducao: 0
          - faixa: 2
            receita_ate: 360000
            aliquota: 7.30
            deducao: 5940
          - faixa: 3
            receita_ate: 720000
            aliquota: 9.50
            deducao: 13860
          - faixa: 4
            receita_ate: 1800000
            aliquota: 10.70
            deducao: 22500
          - faixa: 5
            receita_ate: 3600000
            aliquota: 14.30
            deducao: 87300
          - faixa: 6
            receita_ate: 4800000
            aliquota: 19.00
            deducao: 378000

      - anexo: "II"
        atividade: "Industria"
        faixas:
