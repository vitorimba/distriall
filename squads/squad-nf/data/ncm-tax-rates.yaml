    icms_treatment: "Tributado 12% interno (operacao com veiculo novo)"
    notes: "IPI varia por cilindrada e tipo de combustivel"

  - ncm: "40111000"
    description: "Pneus novos, de borracha, para automoveis"
    ipi_rate: 5
    icms_treatment: "ST obrigatoria em todos os estados"
    notes: "CEST 16.001.00. Convenio ICMS 85/93."

  # ---------------------------------------------------------------------------
  # Materiais de Construcao
  # ---------------------------------------------------------------------------
  - ncm: "69072100"
