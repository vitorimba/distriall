  - ncm: "25232900"
    description: "Cimento Portland"
    ipi_rate: 4
    icms_treatment: "ST obrigatoria na maioria dos estados"
    notes: "CEST 05.001.00"

  # ---------------------------------------------------------------------------
  # Medicamentos
  # ---------------------------------------------------------------------------
  - ncm: "30049099"
    description: "Outros medicamentos para venda a varejo"
    ipi_rate: 0
    icms_treatment: "Tributado — ST obrigatoria. Lista Positiva/Negativa/Neutra CMED."
    notes: "PMC (Preco Maximo ao Consumidor) define BC-ST. Isencao ICMS em alguns."

  # ---------------------------------------------------------------------------
  # Combustiveis
  # ---------------------------------------------------------------------------
  - ncm: "27101259"
    description: "Gasolina automotiva"
    ipi_rate: 0
    icms_treatment: "Monofasico — ICMS recolhido na refinaria"
    notes: "Regime monofasico. Aliquota ad rem (R$/litro)."

  - ncm: "27101921"
    description: "Oleo diesel"
    ipi_rate: 0
    icms_treatment: "Monofasico — ICMS recolhido na refinaria"
    notes: "Regime monofasico. Aliquota ad rem."

  # ---------------------------------------------------------------------------
  # Embalagens
  # ---------------------------------------------------------------------------
  - ncm: "39232190"
    description: "Sacos de plastico (polietileno)"
    ipi_rate: 5
    icms_treatment: "Tributado — aliquota interna padrao"
    notes: "Sem ST na maioria dos estados"

  - ncm: "48191000"
    description: "Caixas de papel ou cartao ondulado"
    ipi_rate: 5
    icms_treatment: "Tributado — aliquota interna padrao"
    notes: "Embalagem para transporte"

# =============================================================================
# Notas Importantes
# =============================================================================
# 1. Aliquotas IPI podem mudar por decreto federal (atualizacoes frequentes)
# 2. Para NCM completo e atualizado, use BrasilAPI: GET /api/ncm/v1/{code}
# 3. ICMS-ST depende de convenios/protocolos entre estados — verificar vigencia
# 4. Aliquotas ICMS interestaduais: 4% (importados), 7% (S/SE para N/NE/CO), 12% (demais)
# 5. Este arquivo e um STUB — nao substitui consulta a TIPI vigente
