  braço de marketing completo (6 agentes) com publicação automática.

  Board: Conselheiros (pensam) → Agente Chefe (decide + executa)
  Marketing: CMO → Ideação (IG/LI/YT) → Produção → Designer → Distribuição → Publicação

  Pipeline end-to-end: da ideia ao post publicado no IG + LinkedIn via API.

