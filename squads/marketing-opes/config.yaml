# ============================================
# MARKETING ARM — 3 KPIs OFICIAIS
# ============================================
marketing_kpis:
  cobrado_por: jose_amorim
  cobrado_de: marketing-cmo
  revisao: semanal

  kpis:
    - id: save-rate
      nome: "Save Rate (Remarkability Index)"
      formula_ig: "(saves + shares) / alcance × 100"
      formula_li: "reposts / impressions × 100"
      meta_ig: "≥ 3%"
      meta_li: "≥ 2%"
      fonte: "Apify (IG) + manual (LI)"

    - id: dms-semana
      nome: "DMs por Semana (Permission Index)"
      formula: "contagem bruta de DMs novas recebidas"
      meta_fase1: "≥ 5/semana (semanas 1-4)"
      meta_fase2: "≥ 15/semana (semanas 5-8)"
      fonte: "input manual José"

    - id: purple-cow-avg
      nome: "Purple Cow Average (Quality Gate)"
      formula: "média semanal dos scores /5 do Gate 2.5"
      meta: "≥ 4.0/5"
      fonte: "registro do CMO Gate em daily-content"

# ============================================
# MARKETING ARM — QA GATES
# ============================================
marketing_qa_gates:
  - id: gate-pre-production
    nome: "CMO Validation (Gate 2.5)"
    quando: "Após ideação, antes de produção"
    dono: marketing-cmo
    acao_falha: "Devolver para @ideation (máx 2 loops)"

  - id: gate-auto-publish
    nome: "Auto-Publish (Gate 6)"
    quando: "Após distribuição, antes de métricas"
    dono: publish.py
    acao_falha: "Registrar erro da API, tentar novamente ou fallback manual"

  - id: gate-post-confirmation
    nome: "Post-Publish Confirmation (Gate 7)"
    quando: "Após publicação automática"
    dono: jose_amorim
    acao_falha: "Registrar alteração ou motivo de remoção"

  - id: gate-feedback-loop
    nome: "Forced Feedback Loop"
    quando: "Final do relatório semanal"
    dono: marketing-metrics
    aprovador: marketing-cmo
    acao_falha: "Semana seguinte usa queue antiga + flag de falha"

