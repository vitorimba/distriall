# ============================================
# POSICIONAMENTO PREMIUM (v2 — 2026-02-01)
# ============================================
positioning:
  tagline: "Eu não ensino IA. Eu instalo empresas."
  identity: "Arquiteto do One Person Enterprise System"
  category: "AI Systems Installation (Premium / Done-for-You)"
  narrative: |
    José Carlos Amorim é o primeiro profissional no Brasil a operar como empresa
    de 6 pessoas usando exclusivamente agentes de IA — e a instalar esse mesmo
    sistema em outros profissionais por preço premium.
    Ele não vende curso. Ele não ensina. Ele instala.

  sva_premium:
    description: "Profissional solo ou micro (1-5 pessoas) que já fatura e quer sistema, não conhecimento"
    perfil:
      faturamento: "R$30k-200k/mês"
      idade: "28-50 anos"
      dor: "Sabe que precisa de sistemas IA mas não confia em agência genérica e não quer equipe tech"
      desejo: "Alguém que entenda negócio + IA e instale a máquina. Não quer aprender a fazer."
      sinal: "Já tentou Zapier, ChatGPT, freelancer dev. Nada integrado."
      identidade: "Se vê como empresário, não como aluno"
    exclusoes:
      - "Quem quer aprender a fazer sozinho (esses compram produto de R$97-497)"
      - "Programadores e devs (já sabem implementar)"
      - "Empresas com equipe tech interna"
      - "Curiosos sem negócio próprio"
      - "Quem busca 'curso de IA'"

  sva_produto_automatico:
    description: "Público dos produtos self-serve (R$97-497) — NÃO aparece no conteúdo orgânico"
    perfil:
      faturamento: "R$5k-30k/mês"
      dor: "Quer aprender a montar seu próprio sistema"
      canal: "Tráfego pago + funil separado — NUNCA contamina a marca premium"

  revenue_model:
    premium:
      tipo: "Instalação de OPES (done-for-you)"
      faixa: "R$15k-50k+ por projeto"
      canal: "Conteúdo orgânico → DM → call → proposta"
    passivo:
      tipo: "Produtos digitais automatizados"
      faixa: "R$97-497"
      canal: "Tráfego pago → landing page → checkout automático"
    regra: "Palco público = premium. Funil pago = produto. NUNCA misturar."

  percepcao_alvo:
    primaria: "Esse cara é um gênio"
    secundaria: "Isso é caro"
    terciaria: "Eu preciso disso"

key_capabilities:
  - "Consulta estratégica com perspectivas múltiplas"
  - "Avaliação de deals e parcerias"
  - "Revisão estratégica periódica"
  - "Priorização implacável de tempo e recursos"
  - "Debate entre conselheiros com visões divergentes"
  - "Marketing arm: conteúdo diário IG + LinkedIn (OPES) com publicação automática via API"

