# ============================================
# PUBLISHING AUTOMATION
# ============================================
publishing:
  script: scripts/publish.py
  credentials: "~/.config/aios/credentials.yaml"
  platforms:
    linkedin:
      api: "/v2/ugcPosts"
      auth: "Bearer token (60 dias)"
      format: "text"
    instagram:
      api: "Content Publishing API (graph.facebook.com/v21.0)"
      auth: "Page token (permanente)"
      format: "image + caption"
      image_gen: "Nano Banana Pro (gemini-3-pro-image-preview)"
      image_host: "catbox.moe (free, no auth)"
    whatsapp:
      api: "UazAPI"
      purpose: "Confirmação de publicação"
  token_renewal:
    linkedin: "~60 dias (manual OAuth re-auth)"
    instagram: "Page token permanente (expires_at: 0)"
  token_monitoring:
    enabled: true
    check_frequency: "semanal (via metrics-weekly Step 5.5)"
    alert_threshold_days: 10
    warning_threshold_days: 20
    tracking_field: "linkedin.token_renewed_at em credentials.yaml"

# ============================================
# TREND SNIPER — Real-time Trend Monitoring
# ============================================
trend_sniper:
  enabled: true
  version: "1.0.0"
  script: scripts/trend_sniper.py
  description: |
    Monitora trending topics do Twitter/X no Brasil via Apify,
    filtra por relevancia SVA e envia alertas WhatsApp.
    Estrategia SNIPER (nao SURFER) — so dispara quando trend passa nos 3 filtros.

  schedule:
    frequency: "a cada 30 min"
    window_brt: "08:00-22:00"
    cron: "*/30 8-21 * * *"

  data_source:
    provider: "Apify"
    actor: "early_kiosk/google-trends-scraper"
    geo: "BR"
    language: "pt-BR"
    cost_estimate: "$0.04/scan (~$35/mes com 28 scans/dia)"
    note: |
      Google Trends "Trending Now" (nao Twitter/X — X restringiu acesso a trends).
      Vantagem: captura o que pessoas BUSCAM (intent), nao so o que tuitam.
      Inclui related queries para matching mais rico contra keyword layers.
      Upgrade futuro: adicionar xAI Grok (grok_x_trends) para dados nativos do X.

  keyword_layers:
    layer_1_direct:
      description: "Keywords diretas do nicho IA"
      examples: ["inteligência artificial", "ChatGPT", "agentes IA", "automação"]
    layer_2_business:
      description: "Keywords de negocio/empreendedorismo"
      examples: ["empreendedor", "escalar", "demiti", "sozinho", "solopreneur"]
    layer_3_contrast:
      description: "Keywords de anti-padrao (oportunidade de contraste)"
      examples: ["curso de IA", "agência de IA", "equipe tech", "bootcamp"]

  scoring:
    score_3: "L1+L2+L3 → ALERTA MAXIMO (WhatsApp imediato)"
    score_2: "L1+L2 → TREND ALERT | L1+L3 → CONTRAST ALERT"
    score_1: "LOG (monitorar, nao agir)"
    score_0: "IGNORAR"
    alert_threshold: 2
    dedup_window_hours: 6

  output:
    alerts_dir: "outputs/hubs/marketing/trends/"
    log_file: "outputs/hubs/marketing/trends/trend-sniper.jsonl"
    format: "post texto simples (resposta rapida < 2h)"

  integration:
    whatsapp: true
    big_brother: true
    ideation_handoff: "Brief .md salvo em trends/ para consumo do @ideation"

  response_flow: |
    Trend detectado (score >= 2)
    → WhatsApp para Jose (GO/SKIP)
    → Se GO: @ideation gera Big Idea
    → @cmo valida (Gate 2.5)
    → @production texto simples
    → @distribution publica (IG + LI)
    Tempo total target: < 2h
