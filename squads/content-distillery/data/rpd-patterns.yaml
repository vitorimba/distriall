# RPD Patterns Database — Recognition-Primed Decision
#
# Purpose: Reference database of RPD patterns used by the tacit-extractor agent (Cedric Chin methodology).
# RPD captures how experts make rapid decisions using pattern recognition rather than analytical comparison.
#
# Usage: The tacit-extractor agent matches transcript signals against these patterns
# to identify tacit knowledge being expressed by speakers.
#
# Methodology: Based on Gary Klein's RPD model as applied by Cedric Chin
# for extracting expertise from practitioners.
#
# Maintained by: knowledge-architect / tacit-extractor agents
