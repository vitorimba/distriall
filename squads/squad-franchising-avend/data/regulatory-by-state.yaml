# Regulatory Requirements by State — Vending Machines / Autoatendimento
# Squad: squad-franchising-avend (Avend Franquias)
# Última atualização: 2026-03-13
# Cobertura: 11 estados prioritários + base nacional

metadata:
  source: "ANVISA, Secretarias Estaduais de Saúde, legislação estadual"
  disclaimer: >
    Requisitos regulatórios mudam frequentemente. Este documento é
    referência inicial. SEMPRE consultar legislação vigente e
    profissional local (advogado + contador) antes de operar.
    Última verificação: março 2026.
  escala_dificuldade: "1 (fácil) a 5 (muito difícil)"

# ============================================================
# BASE NACIONAL — Aplicável a TODOS os estados
# ============================================================
base_nacional:
  anvisa:
    rdc_216_2004:
      descricao: "Boas Práticas para Serviços de Alimentação"
      obrigatorio: true
      aplicacao_vending: >
        Aplica-se a estabelecimentos que manipulam, preparam,
        armazenam, transportam, expõem à venda ou entregam
        alimentos ao consumidor. Vending machines se enquadram
        como ponto de venda de alimentos.
      requisitos:
        - "Manual de Boas Práticas (MBP)"
        - "Procedimentos Operacionais Padronizados (POP)"
        - "Controle de temperatura (se alimentos refrigerados)"
        - "Higienização periódica dos equipamentos"
        - "Controle de pragas no entorno"
        - "Rastreabilidade de produtos"

    rdc_275_2002:
      descricao: "POP e Lista de Verificação de BPF"
      obrigatorio: true
      aplicacao_vending: "Check-list de conformidade"

    rotulagem:
      rdc_429_2020: "Rotulagem nutricional"
      rdc_727_2022: "Rotulagem de alimentos"
      aplicacao: >
        Produtos vendidos nas máquinas devem ter rotulagem conforme
        legislação. Responsabilidade primária do fabricante, mas
        franqueado deve verificar conformidade.

  tributario_federal:
    simples_nacional:
      descricao: "Regime simplificado para ME e EPP"
      limite_faturamento_anual: 4800000
      anexo: "I — Comércio"
      aliquota_inicial: 4.0  # %
      aliquota_maxima: 19.0  # %
      nota: "Franqueados Avend tipicamente nas faixas iniciais"

    mei:
      descricao: "Microempreendedor Individual"
      limite_faturamento_anual: 81000
      aplicavel: false
      motivo: >
        MEI permite apenas 1 funcionário e limite de R$ 81k/ano.
        Pode ser insuficiente para operação de vending com
        múltiplas máquinas. Avaliar caso a caso.

  trabalhista:
    nota: >
      Franqueado é empresário independente, não funcionário.
      Se contratar auxiliares, seguir CLT normalmente.
      Relação franqueador-franqueado NÃO é trabalhista (Lei 13.966/2019).

