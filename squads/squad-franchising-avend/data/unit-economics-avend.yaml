      transacoes_dia_media: 30
      ticket_medio: 5.50
      receita_diaria: 165.00
      receita_mensal: 4950.00  # 30 dias
      sazonalidade:
        meses_fortes: [3, 4, 5, 8, 9, 10, 11]  # março-maio, agosto-novembro
        meses_fracos: [1, 2, 7, 12]  # janeiro, fevereiro, julho, dezembro
        variacao_forte: 1.15  # +15%
        variacao_fraco: 0.80  # -20%

    bebidas:
      transacoes_dia_media: 35
      ticket_medio: 4.50
      receita_diaria: 157.50
      receita_mensal: 4725.00
      sazonalidade:
        meses_fortes: [10, 11, 12, 1, 2, 3]  # outubro-março (calor)
        meses_fracos: [5, 6, 7, 8]  # maio-agosto (frio)
        variacao_forte: 1.25  # +25%
        variacao_fraco: 0.75  # -25%

    cafe:
      transacoes_dia_media: 25
      ticket_medio: 3.50
      receita_diaria: 87.50
      receita_mensal: 2625.00
      sazonalidade:
        meses_fortes: [5, 6, 7, 8]  # maio-agosto (frio)
        meses_fracos: [11, 12, 1, 2]  # novembro-fevereiro (calor)
        variacao_forte: 1.20
        variacao_fraco: 0.85

  por_tipo_de_ponto:
    corporativo:
      descricao: "Empresas com 100+ funcionários"
      receita_mensal_media: 5500
      variabilidade: "baixa"
      sazonalidade: "Cai em férias coletivas (dez-jan)"
    shopping:
      descricao: "Shoppings centers, áreas de alimentação"
      receita_mensal_media: 4800
      variabilidade: "media"
      sazonalidade: "Picos em datas comerciais"
    educacao:
      descricao: "Universidades, escolas técnicas"
      receita_mensal_media: 4200
      variabilidade: "alta"
      sazonalidade: "Cai fortemente em férias (jan, jul)"
    saude:
      descricao: "Hospitais, clínicas, laboratórios"
      receita_mensal_media: 3800
      variabilidade: "baixa"
      sazonalidade: "Estável — funciona 24/7"
    transporte:
      descricao: "Rodoviárias, metrô, aeroportos"
      receita_mensal_media: 6000
      variabilidade: "media"
      sazonalidade: "Picos em feriados e férias"

  receita_mensal_unitaria:
    composicao: "2-3 máquinas por unidade franqueada"
    pessimista: 8000
    realista: 12000
    otimista: 16000

# ============================================================
# ESTRUTURA DE CUSTOS
# ============================================================
custos:
  variaveis:
    cogs:
      descricao: "Custo dos produtos vendidos"
      percentual_receita: 40
      detalhamento:
        snacks: 38  # margem bruta 62%
        bebidas: 42  # margem bruta 58%
        cafe: 35  # margem bruta 65%
      nota: "Fornecedores homologados garantem preço"

    royalties:
      descricao: "Royalty mensal para franqueadora"
      percentual_receita: 5
      base_calculo: "faturamento bruto"
      minimo_mensal: 0  # sem mínimo na fase early-growth
      nota: "Multi-unidade pode ter desconto (ver playbook)"

    fundo_marketing:
      descricao: "Contribuição ao fundo de marketing da rede"
      percentual_receita: 2
      base_calculo: "faturamento bruto"

    impostos:
      descricao: "Simples Nacional (faixa inicial)"
      percentual_receita: 6
      regime: "Simples Nacional"
      faixa: "Anexo I — Comércio"
      nota: "Alíquota efetiva varia conforme faturamento acumulado 12 meses"

    taxa_pagamento_digital:
      descricao: "Taxa de cartão/PIX (operadora de pagamento)"
      percentual_receita: 2.5
      detalhamento:
        cartao_credito: 3.5
        cartao_debito: 2.0
        pix: 0.5
        dinheiro: 0
      mix_estimado:
        cartao: 40
        pix: 45
        dinheiro: 15

  fixos_mensais:
    manutencao:
      valor: 500
      descricao: "Manutenção preventiva e corretiva"
      detalhamento:
        preventiva: 200  # Mensal
        corretiva_media: 300  # Média mensal (varia)
    reposicao_logistica:
      valor: 400
      descricao: "Combustível, transporte para reposição"
    telefonia_internet:
      valor: 100
      descricao: "Chip de dados para telemetria das máquinas"
    seguro:
      valor: 150
      descricao: "Seguro dos equipamentos"
    contador:
      valor: 300
      descricao: "Serviço contábil mensal"
    diversos:
      valor: 200
      descricao: "Limpeza, material, imprevistos"

  total_fixo_mensal: 1650

