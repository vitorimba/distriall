# Unit Economics — Avend Franquias (Modelo Calibrado)
# Squad: squad-franchising-avend
# Founder: Guilherme Alvares
# Modelo: Vending machines (snacks, bebidas, café)
# Investimento base: R$ 50.000
# Última atualização: 2026-03-13

metadata:
  empresa: "Avend Franquias"
  segmento: "Vending machines / Autoatendimento"
  mercado: "Brasil"
  moeda: "BRL"
  estagio: "Early-growth"
  disclaimer: >
    Modelo financeiro de referência. Resultados reais podem variar conforme
    localização, tipo de ponto, mix de produtos e gestão do franqueado.
    Revisar trimestralmente com dados reais da rede.

# ============================================================
# INVESTIMENTO INICIAL — BREAKDOWN
# ============================================================
investimento:
  total: 50000
  composicao:
    taxa_franquia:
      valor: 15000
      percentual: 30
      descricao: "Direito de uso da marca, treinamento, suporte inicial"
      condicao_pagamento: "À vista ou 3x sem juros"
    equipamentos:
      valor: 22000
      percentual: 44
      descricao: "2-3 máquinas de vending (snacks + bebidas)"
      detalhamento:
        maquina_snacks:
          valor: 9000
          quantidade: 1
        maquina_bebidas:
          valor: 8000
          quantidade: 1
        maquina_cafe_ou_combo:
          valor: 5000
          quantidade: 1
          nota: "Opcional — pode ser 3ª máquina snacks/bebidas"
      condicao_pagamento: "À vista ou 12x com taxa"
    capital_giro:
      valor: 8000
      percentual: 16
      descricao: "Estoque inicial, primeiros meses de operação"
      detalhamento:
        estoque_inicial: 5000
        reserva_operacional: 3000
    marketing_inicial:
      valor: 3000
      percentual: 6
      descricao: "Material de divulgação, adesivos, ativação nos pontos"
    instalacao_e_configuracao:
      valor: 2000
      percentual: 4
      descricao: "Instalação de máquinas, sistema de pagamento, telemetria"

# ============================================================
# MODELO DE RECEITA
# ============================================================
receita:
