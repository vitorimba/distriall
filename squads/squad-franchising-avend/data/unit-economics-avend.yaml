  ponto_equilibrio_mensal:
    descricao: "Faturamento mínimo para cobrir custos fixos + variáveis"
    formula: "Custos fixos / (1 - % custos variáveis)"
    custos_fixos: 1650
    margem_contribuicao_pct: 44.5  # 100% - 55.5% (COGS + royalty + mkt + imposto + taxa)
    faturamento_minimo: 3708
