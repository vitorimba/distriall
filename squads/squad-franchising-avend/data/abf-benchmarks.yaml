# ABF Benchmark Metrics by Segment
# Source: ABF (Associação Brasileira de Franchising) — Relatórios anuais
# Squad: squad-franchising-avend (Avend Franquias)
# Última atualização: 2026-03-13
# Nota: Valores são referências de mercado. Confirmar com relatório ABF vigente.

metadata:
  source: "ABF — Associação Brasileira de Franchising"
  reference_year: 2025
  currency: BRL
  disclaimer: >
    Valores baseados em relatórios públicos ABF e pesquisas setoriais.
    Dados de vending/autoatendimento são parcialmente estimados por ser
    segmento emergente no franchising brasileiro. Consultar ABVA para
    dados específicos de vending.

# ============================================================
# SEGMENTO PRINCIPAL: Vending / Autoatendimento
# ============================================================
vending_autoatendimento:
  description: "Máquinas automáticas de venda (snacks, bebidas, café, etc.)"
  relevancia_avend: "SEGMENTO DIRETO — principal benchmark"

  investimento:
    taxa_franquia:
      min: 10000
      max: 30000
      media: 18000
      avend_posicao: 15000  # R$ 15k — abaixo da média (acessível)
    investimento_total:
      min: 25000
      max: 120000
      media: 55000
      avend_posicao: 50000  # R$ 50k — na média
    capital_giro:
      min: 5000
      max: 20000
      media: 10000

  performance:
    faturamento_medio_mensal:
      min: 5000
      max: 25000
      media: 12000
      avend_projecao: 12000
    ticket_medio:
      min: 3.50
      max: 12.00
      media: 6.50
    transacoes_dia_por_maquina:
      min: 15
      max: 80
      media: 35

  retorno:
    prazo_retorno_meses:
      min: 6
      max: 24
      media: 14
      avend_projecao: 12
    roi_anual_percentual:
      min: 30
      max: 120
      media: 65
      avend_projecao: 74
    margem_bruta_percentual:
      min: 35
      max: 65
      media: 48

  rede:
    taxa_mortalidade_percentual:
      ano_1: 8
      ano_3: 15
      ano_5: 22
    crescimento_rede_anual_percentual:
      media: 18
      top_quartil: 35
    satisfacao_franqueado_nps:
      media: 42
      top_quartil: 65

  taxas:
    royalty_percentual:
      min: 3
      max: 8
      media: 5
    fundo_marketing_percentual:
      min: 1
      max: 3
      media: 2

