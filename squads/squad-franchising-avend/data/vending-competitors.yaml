# Competitive Landscape — Franquias de Vending Machines no Brasil
# Mapeamento de concorrentes diretos e indiretos da Avend Franquias
# Squad: franchising-avend
# Updated: 2026-03-13

id: vending-competitors
name: "Competitive Landscape — Vending Machine Franchises Brazil"
version: "1.0.0"
squad: franchising-avend
description: >-
  Mapeamento competitivo completo do mercado brasileiro de franquias de
  vending machines. Inclui concorrentes diretos (franquias de vending),
  concorrentes indiretos (autosservico e microfranquias de baixo investimento),
  analise comparativa e posicionamento estrategico da Avend.

last_updated: "2026-03-13"
data_sources:
  - "Portal ABF — Associacao Brasileira de Franchising"
  - "Guia de Franquias ABF 2025"
  - "Sites institucionais dos concorrentes"
  - "Econodata e bases publicas"
  - "Relatorios setoriais (ABVA — Associacao Brasileira de Vending)"

# ============================================================================
# AVEND FRANQUIAS — Posicao Atual (baseline para comparacao)
# ============================================================================

avend_baseline:
  nome: "Avend Franquias"
  fundacao: 2019
  sede: "Sao Paulo, SP"
  modelo: "Microfranquia de vending machines"
  segmento_principal: "Snacks, bebidas, conveniencia"
  investimento_total: "R$47k - R$55k"
  taxa_franquia: "R$15k - R$25k"
  royalties: "Taxa fixa mensal (variavel por modelo)"
  fundo_marketing: "Nao aplicavel / incluso"
  unidades_rede: "~90 contratos de franquia"
  maquinas_rede: "~184 maquinas"
  faturamento_medio_mensal: "R$3k - R$8k por maquina"
  payback_estimado: "12-18 meses"
  diferenciais:
    - "Tecnologia de telemetria propria"
    - "Modelo semi-passivo comprovado"
    - "Suporte operacional completo"
    - "Treinamento presencial e online"
    - "Sistema de pagamento completo (PIX, cartao, dinheiro)"
    - "Associada ABF"
