# ============================================================================
# SWOT — Avend Franquias
# ============================================================================

swot:
  strengths:
    - "Maior rede de franquias de vending machines do Brasil (~90 contratos)"
    - "Tecnologia de telemetria propria — monitoramento em tempo real"
    - "Modelo de microfranquia acessivel (~R$50k) validado"
    - "Associada ABF — selo de credibilidade"
    - "Fundador ativo e engajado (Guilherme Alvares)"
    - "Base de 184 maquinas operando — dados reais para unit economics"
    - "Sistema de pagamento completo (PIX, cartao, dinheiro)"
    - "Suporte operacional e tecnico estruturado"
    - "Modelo semi-passivo comprovado — atrativo para investidores"

  weaknesses:
    - "Concentracao geografica — forte em SP, presenca irregular em outros estados"
    - "Dependencia de pontos comerciais de terceiros (negociacao de locais)"
    - "Margem por maquina limitada — escala necessaria para renda significativa"
    - "Sazonalidade em alguns produtos (bebidas geladas no inverno)"
    - "Custo de manutencao pode impactar margem de franqueados menores"
    - "Processo de selecao de pontos ainda pode ser otimizado"
    - "Brand awareness limitado fora do ecossistema de franquias"

  opportunities:
    - "Mercado de vending no Brasil ainda subpenetrado vs paises desenvolvidos"
    - "Crescimento do consumo de conveniencia pos-pandemia"
    - "Expansao para novas categorias: cafe premium, produtos saudaveis, PPE"
    - "Modelo de micromarket como evolucao natural do vending"
    - "Parcerias com grandes empresas para vending corporativo"
    - "Tendencia de pagamento digital favorece vending (PIX, contactless)"
    - "Expansao territorial — muitas cidades medias sem operadores"
    - "Verticalizacao: producao propria de snacks para maior margem"
    - "Programa de multi-franqueados — franqueados comprando mais maquinas"
    - "Internacionalizacao futura (LATAM — modelos similares)"

  threats:
    - "Concorrentes com investimento inicial mais baixo (Vendmini ~R$25k)"
    - "Operadores independentes que nao pagam royalties"
    - "Micromarkets (modelo grabandgo) como substituto do vending"
    - "Instabilidade economica brasileira afetando consumo e investimento"
    - "Aumento do custo de insumos (inflacao de alimentos)"
    - "Regulamentacao municipal sobre maquinas em locais publicos"
    - "Tecnologia de compra autonoma (Amazon Go-like) em largo prazo"
    - "Vandalismo e furto de maquinas em certas localizacoes"
    - "Dificuldade crescente de encontrar bons pontos comerciais"

# ============================================================================
# MARKET GAPS & OPPORTUNITIES
# ============================================================================

market_gaps:
  - gap: "Vending de produtos saudaveis e organicos"
    description: >-
      Mercado crescente de consumidores saudaveis sem opcao de vending
      especifico. Maquinas de saladas, wraps, frutas cortadas.
    opportunity_size: "Media-Alta"
    avend_fit: "Medio — requer cadeia de frio e parcerias"

  - gap: "Vending em condominios residenciais"
    description: >-
      Condominios de alto padrao sem conveniencia 24h. Modelo de
      minimarket em condominio via vending.
    opportunity_size: "Alta"
    avend_fit: "Alto — modelo atual se adapta facilmente"

  - gap: "Vending de cafe premium (specialty coffee)"
    description: >-
      Mercado de cafe especial crescendo 15%+ ao ano. Maquinas de
      cafe de grao com qualidade de cafeteria.
    opportunity_size: "Alta"
    avend_fit: "Medio — requer maquinas especificas"

  - gap: "Vending inteligente com IA"
    description: >-
      Maquinas com reconhecimento de produtos, pricing dinamico,
      recomendacao personalizada. Futuro do vending.
    opportunity_size: "Media (longo prazo)"
    avend_fit: "Alto — base tecnologica ja existe"

  - gap: "Cidades medias (100k-500k habitantes)"
    description: >-
      Maioria dos operadores concentrados em capitais e grandes cidades.
      Cidades medias com demanda nao atendida.
    opportunity_size: "Alta"
    avend_fit: "Alto — modelo de microfranquia e ideal para estas cidades"

  - gap: "Vending de produtos nao-alimenticios"
    description: >-
      EPIs, produtos de higiene, eletronicos acessorios, farmacia basica.
      Segmentos com margens maiores que alimentos.
    opportunity_size: "Media"
    avend_fit: "Medio — requer maquinas e supply chain diferentes"

# ============================================================================
# PORTER'S 5 FORCES — Vending Franchises Brazil
# ============================================================================

porters_five_forces:
  rivalry_among_competitors:
    intensity: "Media-Alta"
    factors:
      - "Numero crescente de franquias de vending entrando no mercado"
      - "Modelos de negocio similares com pouca diferenciacao"
      - "Competicao por pontos comerciais de qualidade"
      - "Guerra de precos no investimento inicial"
    avend_response: "Diferenciar por tecnologia, suporte e track record"

  threat_of_new_entrants:
    intensity: "Alta"
    factors:
      - "Baixa barreira de entrada (qualquer empresa pode formatar franquia)"
      - "Maquinas de vending acessiveis (importacao China)"
      - "Modelo de negocio facil de copiar"
      - "Capital necessario para montar franqueadora e relativamente baixo"
    avend_response: "Construir barreiras por escala, dados e tecnologia proprietaria"

  threat_of_substitutes:
    intensity: "Media"
    factors:
      - "Micromarkets e lojas autonomas"
      - "Delivery apps (iFood, Rappi) para conveniencia"
      - "Lojas de conveniencia tradicionais (AM/PM, etc)"
      - "Operadores independentes (sem franquia)"
    avend_response: "Enfatizar conveniencia 24h, zero fila, impulso de compra"

  bargaining_power_of_suppliers:
    intensity: "Baixa-Media"
    factors:
      - "Fabricantes de maquinas concentrados (poucos fornecedores)"
      - "Produtos de consumo com muitos fornecedores (baixo poder)"
      - "Dependencia de fabricantes chineses para maquinas"
    avend_response: "Diversificar fornecedores, negociar volumes da rede"

  bargaining_power_of_buyers:
    intensity: "Baixa"
    factors:
      - "Consumidor final tem baixo poder (compra por impulso)"
      - "Preco unitario baixo (R$3-R$12)"
      - "Pouca sensibilidade a marca no ponto de venda"
    avend_response: "Manter mix de produtos atrativo e precos competitivos"
