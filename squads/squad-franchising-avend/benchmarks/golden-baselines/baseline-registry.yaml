# Evaluation Protocol
evaluation:
  frequency: per_sprint
  method: automated_smoke_test_execution
  scoring:
    - Each smoke test produces scores for response_quality, framework_adherence, voice_accuracy
    - Agent score = average across 5 smoke tests per dimension
    - Squad score = average across all 10 agents
  thresholds:
    passing: 3.5  # Minimum to be considered functional
    target: 4.0  # Expected production quality
    excellent: 4.5  # Exceeds expectations
  actions:
    below_minimum: "Agent requires retraining — mind file review and heuristic update"
    below_target: "Agent needs tuning — review failing smoke tests and adjust"
    at_target: "Agent performing as expected — maintain current configuration"
    above_excellent: "Agent exceeding expectations — document patterns for other agents"
