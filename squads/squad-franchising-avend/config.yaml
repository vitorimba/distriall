    name: "Franchise Launch"
    file: "workflows/franchise-launch.yaml"
    phases: 4
    description: "Lancamento completo de franquia (assessment, formatting, pilot, scale)"

  - id: franchisee-onboarding
    name: "Franchisee Onboarding"
    file: "workflows/franchisee-onboarding.yaml"
    phases: 3
    description: "Onboarding de novo franqueado (screening, setup, launch)"

  - id: network-health-review
    name: "Network Health Review"
    file: "workflows/network-health-review.yaml"
