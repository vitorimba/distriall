# ============================================================================
# USE CASES
# ============================================================================

use_cases:
  - name: "Avaliar franqueabilidade"
    description: "Avaliar se o negocio esta pronto para ser franqueado"
    tiers: [tier_0]
  - name: "Formatar franquia"
    description: "COF, manual, contratos, treinamento"
    tiers: [tier_0, tier_1]
  - name: "Recrutar franqueados"
    description: "Marketing, triagem, qualificacao, conversao"
    tiers: [tier_2]
  - name: "Onboardar franqueado"
    description: "Contrato, treinamento, instalacao, go-live"
    tiers: [tier_1, tier_3]
  - name: "Monitorar rede"
    description: "KPIs, NPS, health score, benchmarking"
    tiers: [tier_1, tier_3]
  - name: "Expandir territorios"
    description: "Analise de mercado, mapeamento, plano de expansao"
    tiers: [tier_2]
  - name: "Auditar operacoes"
    description: "Auditoria de qualidade das unidades franqueadas"
    tiers: [tier_1, tier_3]
  - name: "Suporte a franqueados"
    description: "Check-ins 30/60/90, resolucao de problemas"
    tiers: [tier_3]
  - name: "Modelagem financeira"
    description: "Unit economics, DRE, payback, cenarios"
    tiers: [tier_1]

# ============================================================================
# QUALITY GATES
# ============================================================================

quality_gates:
  - id: FA-QG-001
    name: "Franchisability Gate"
    transition: "Assessment → Formatting"
    description: "Valida que o negocio e franqueavel antes de investir em formatacao"
    checks:
      - "Franchisability Score >= 60/100"
      - "Nenhum pilar critico abaixo do minimo"
      - "Modelo financeiro viavel (payback <= 24 meses)"

  - id: FA-QG-002
    name: "COF Compliance Gate"
    transition: "Draft COF → Approved COF"
    description: "Valida conformidade da COF com Lei 13.966/2019"
    checks:
      - "Todas secoes obrigatorias presentes"
      - "Revisao juridica concluida"
      - "Valores consistentes com modelo financeiro"

  - id: FA-QG-003
    name: "Franchisee Qualification Gate"
    transition: "Candidato → Aprovado"
    description: "Valida qualificacao do candidato a franqueado"
    checks:
      - "Score geral >= 60/100"
      - "Nenhum veto condition ativo"
      - "Referencias verificadas"

  - id: FA-QG-004
    name: "Onboarding Completion Gate"
    transition: "Setup → Go-Live"
    description: "Valida que onboarding esta completo antes do go-live"
    checks:
      - "Treinamento concluido e aprovado"
      - "Maquinas instaladas e testadas"
      - "Sistemas configurados"
      - "Abastecimento inicial realizado"

  - id: FA-QG-005
    name: "Pilot Validation Gate"
    transition: "Pilot → Scale"
    description: "Valida resultados do piloto antes de escalar"
    checks:
      - "80%+ franqueados piloto atingiram breakeven"
      - "NPS medio >= 7"
      - "Modelo financeiro validado na pratica"

  - id: FA-QG-006
    name: "Network Health Gate"
    transition: "Review → Action Plan"
    description: "Valida saude da rede antes de definir acoes"
    checks:
      - "Dados de >= 70% da rede coletados"
      - "Health Score calculado"
      - "Franqueados classificados em clusters"

  - id: FA-QG-007
    name: "Expansion Readiness Gate"
    transition: "Planning → Execution"
    description: "Valida que a franqueadora esta pronta para expandir"
    checks:
      - "Equipe de suporte dimensionada"
      - "Budget aprovado"
      - "Territorios mapeados e priorizados"

  - id: FA-QG-008
    name: "Legal Compliance Gate"
    transition: "Contract → Signature"
    description: "Valida compliance legal antes de assinatura de contrato"
    checks:
      - "COF entregue com protocolo"
      - "Cooling period de 10 dias cumprido"
      - "Contrato revisado por advogado"

# ============================================================================
# GOVERNANCE
# ============================================================================

governance:
  quality_gates_file: "config/quality-gates.yaml"
  veto_conditions_file: "config/veto-conditions.yaml"
  heuristics_file: "config/heuristics.yaml"

# ============================================================================
# TESTING
# ============================================================================

testing:
  benchmarks:
    - id: FA-BENCH-001
      name: "COF Compliance"
      description: "Validar COF contra todos os requisitos legais"
      expected: "100% dos itens obrigatorios presentes"
    - id: FA-BENCH-002
      name: "Franchisee Qualification"
      description: "Score de qualificacao para candidato padrao"
      expected: "Score >= 60 para candidato qualificado"
    - id: FA-BENCH-003
      name: "Unit Economics"
      description: "Modelo financeiro gera payback <= 24 meses"
      expected: "Payback realista <= 18 meses"

  smoke_tests:
    - "franchise-chief responde a saudacao"
    - "franchise-strategist gera franchisability score"
    - "financial-modeler gera DRE projetada"
    - "legal-compliance valida COF"
    - "recruitment-specialist qualifica candidato"

# ============================================================================
# SCRIPTS
# ============================================================================

scripts:
  validate_cof: "scripts/validate-cof.sh"
  generate_report: "scripts/generate-network-report.sh"
  qualify_candidate: "scripts/qualify-candidate.sh"

# ============================================================================
# SETTINGS
# ============================================================================

settings:
  activation:
    show_ecosystem_report: true
    show_greeting: true
    show_quick_commands: true
  ecosystem_report:
    show_totals: true
    show_top_squads: false
    show_quality_refs: true
    show_gaps: true
    top_squads_limit: 5

# ============================================================================
# ROUTING RULES
# ============================================================================

routing:
  default_flow: "intake → strategy → execution → quality_gate → delivery"
  tier_routing_rules:
    - condition: "Avaliacao de franqueabilidade ou estrategia"
      route_to: tier_0
    - condition: "Modelagem financeira ou operacional"
      route_to: tier_1
    - condition: "Expansao, recrutamento ou marketing"
      route_to: tier_2
    - condition: "Suporte, relacionamento ou sistemas"
      route_to: tier_3
    - condition: "Onboarding completo de franqueado"
      route_to: [tier_1, tier_2, tier_3]
      mode: sequential
