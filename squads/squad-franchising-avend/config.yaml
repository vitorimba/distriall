# Franchising Avend Squad — Rede de Franquias de Vending Machines
# Squad completo para gestao e expansao da rede Avend Franquias
# Updated: 2026-03-13

name: franchising-avend
version: 1.0.0-pro
tested: false
updated_at: "2026-03-13"
short-title: Franchising Avend Squad
description: >-
  Squad completo para gestao da maior rede de franquias de vending machines
  do Brasil — Avend Franquias. 13 agentes especializados em formatacao,
  expansao, operacao e compliance de franquias. Fundador: Guilherme Alvares.
  184 maquinas, 90 contratos de franquia, ~R$20M faturamento.
  Associada ABF. Modelo de microfranquia de vending machines.

author: Synkra AIOX
entry_agent: franchising-chief
slashPrefix: Avend
pattern_prefix: FA

target_user: >-
  Guilherme Alvares e equipe Avend Franquias — gestao da rede de franquias
  de vending machines, expansao territorial e suporte a franqueados.

# ============================================================================
# TIER STRUCTURE
# ============================================================================

tier_structure:
  orchestrator: franchising-chief

  # Tier 0 — Strategy & Governance
  tier_0:
    description: "Estrategia, governanca e decisoes de alto nivel da rede"
    agents:
      - id: franchise-architect
        role: "Estrategia de franchising, avaliacao de franqueabilidade, planejamento de expansao"
        mind: minds/michael-gerber.md
      - id: franchise-legal
        role: "Compliance legal, COF, contratos, Lei 13.966/2019, INPI"
        mind: minds/andrew-sherman.md

  # Tier 1 — Operations & Finance
  tier_1:
    description: "Operacoes, financeiro e modelagem do negocio de franquia"
    agents:
      - id: franchise-financial
        role: "Modelagem financeira, unit economics, DRE, payback, cenarios"
        mind: minds/mark-siebert.md
      - id: franchise-operations
        role: "Design de processos operacionais, manual, SOPs, auditorias"
        mind: minds/michael-seid.md
      - id: franchise-training
        role: "Programa de treinamento, materiais, avaliacao, certificacao"
        mind: minds/penny-hopkinson.md
      - id: franchise-master-br
        role: "Estrategia de franquias no mercado brasileiro, ABF, Lei 13.966"
        mind: minds/marcelo-cherto.md
      - id: franchise-lifecycle
        role: "Ciclo de vida da franquia, internacionalizacao, maturidade"
        mind: minds/ana-vecchi.md

  # Tier 2 — Growth & Recruitment
  tier_2:
    description: "Expansao, recrutamento e marketing de franqueados"
    agents:
      - id: franchise-growth
        role: "Crescimento da rede, analise de mercado, territorios, concorrencia"
        mind: minds/joe-mathews.md
      - id: franchise-assessor
        role: "Recrutamento e qualificacao de candidatos a franqueado"
        mind: minds/mark-siebert.md
      - id: franchise-documentation
        role: "Manuais de operacao, SOPs, documentacao de processos"
        mind: minds/adir-ribeiro.md

  # Tier 3 — Relationship & Support
  tier_3:
    description: "Relacionamento com franqueados e suporte continuo"
    agents:
      - id: franchise-relationship
        role: "Gestao do relacionamento, satisfacao, NPS, check-ins 30/60/90"
        mind: minds/greg-nathan.md
      - id: franchise-field-ops
        role: "Operacoes de campo, visitas, auditorias in-loco, suporte presencial"
        mind: minds/adir-ribeiro.md

