schema: 1
story: '5.5'
story_id: '5.5.2'
story_title: 'Componente Receipt para impressao termica + Dialog de preview'
gate: CONCERNS
status_reason: >
  Implementação sólida: port fiel do DS, DS tokens corretos, Dialog DS integrado,
  print CSS bem estruturado. CONCERNS por: (1) ausência de testes automatizados para
  receipt.tsx e order-receipt.tsx, (2) AC3 — botão "Imprimir" dentro do Dialog usa
  window.print() em vez de tentar Web Bluetooth primeiro (Bluetooth está no pai, não no Dialog),
  (3) deploy_type vercel sem infrastructure-map.json no projeto (reincidência de I03 de 5.5.1).
reviewer: 'Quinn (Test Architect)'
updated: '2026-06-13T19:00:00Z'

top_issues:
  - id: I01
    severity: medium
    category: tests
    description: >
      Nenhum teste unitário ou de integração para receipt.tsx e order-receipt.tsx.
      Cenários de validação da story (dual-theme, Dialog abre correto, itens renderizados,
      window.print chamado, handle share) não têm cobertura automatizada.
    recommendation: >
      Adicionar testes com vitest + @testing-library/react cobrindo: (a) Receipt renderiza
      itens corretamente, (b) subtotal/desconto opcionais, (c) OrderReceipt abre Dialog
      ao receber open=true, (d) botão Imprimir chama window.print(), (e) handleShare
      usa navigator.share ou clipboard fallback.
    suggested_owner: dev

  - id: I02
    severity: medium
    category: requirements
    description: >
      AC3 especifica que o botão "Imprimir" no Dialog tenta Web Bluetooth (Chrome/Edge Android).
      Na implementação, o Bluetooth está no pai (page.tsx) e o Dialog contém apenas window.print().
      O Dialog é o fallback para quando Bluetooth não está disponível ou falha — mas o AC diz
      que o botão no Dialog tenta BT. Há ambiguidade: a arquitetura (BT no pai) é tecnicamente
      melhor (evita dupla instância do hook), mas diverge da especificação literal do AC.
    recommendation: >
      Alinha com PO: aceitar a arquitetura atual (BT no pai, Dialog = fallback window.print)
      ou ajustar AC3 para refletir o design real. Recomendo aceitar como WONT_FIX com
      justificativa técnica documentada (dupla instância do hook seria incorreta).
    suggested_owner: po

  - id: I03
    severity: low
    category: infrastructure
    description: >
      deploy_type: vercel definido na story mas infrastructure/infrastructure-map.json
      não existe no projeto. Deploy readiness não pode ser validado via registry formal.
      Reincidência do I03 de 5.5.1 — não foi criado entre as duas stories.
    recommendation: >
      Criar infrastructure/infrastructure-map.json com entrada para vercel, ou remover
      deploy_type das stories se o workflow atual não usa registry formal.
    suggested_owner: sm

  - id: I04
    severity: low
    category: code
    description: >
      order-receipt.tsx: data/hora do recibo usa new Date() no render (linha 57), sem
      useMemo. Em SSR/SSG isso não é problema (componente é 'use client'), mas cada
      re-render gera uma nova instância. Low severity porque o Dialog abre raramente.
    recommendation: >
      Memoizar: const date = useMemo(() => new Date().toLocaleString('pt-BR'), []);
      ou receber como prop para consistência entre renders do Dialog.
    suggested_owner: dev

