nfr_validation:
  security:
    status: PASS
    notes: >
      Nenhuma superficie de ataque. window.print() e navigator.share sao APIs de browser
      padrao sem risco de injecao. handleShare usa template string com dados ja sanitizados
      pelo Supabase. Nenhum input do usuario direto nos componentes de recibo.
  performance:
    status: PASS
    notes: >
      receipt.tsx e estateless e puro. order-receipt.tsx tem apenas uma instancia de new Date()
      por abertura de Dialog (low impact). Dialog base-ui usa animacoes CSS-only. @media print
      usa display:none, sem reflow pesado. Sem consultas ao banco nos componentes de recibo.
  reliability:
    status: PASS
    notes: >
      printOrder no pai usa try/catch que faz fallback para setShowReceipt(true) em caso de
      erro BT. window.print() e sincrono e nao pode falhar silenciosamente. handleShare tem
      fallback clipboard quando navigator.share nao disponivel. Casos de borda cobertos.
  maintainability:
    status: CONCERNS
    notes: >
      Sem testes automatizados para receipt.tsx e order-receipt.tsx. Port do DS e fiel
      mas nao verificado por suite automatizada. Futuros devs nao tem safety net para
      regredir o comportamento de dual-theme ou fallback de impressao.

